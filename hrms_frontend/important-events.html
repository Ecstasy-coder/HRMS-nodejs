<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Important Events · My Ecstasy HR Portal</title>
  <script src="/api-config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="common.css" />

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Sora', Arial, system-ui, sans-serif; }

    /* ── Add Event strip ────────────────────────────────────── */
    .top-strip {
      background: #fff;
      padding: 20px 28px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      box-shadow: 0 4px 16px rgba(15,23,42,.05);
      border: 1px solid #eef3fa;
    }
    .top-strip h2 { font-size: 17px; font-weight: 700; color: #0f172a; }
    .add-btn {
      background: linear-gradient(135deg, #17365d, #2563eb);
      color: #fff; border: none; font-family: inherit; font-size: 14px;
      font-weight: 700; cursor: pointer; padding: 10px 22px; border-radius: 40px;
      transition: opacity .2s, transform .18s;
    }
    .add-btn:hover { opacity: .88; transform: translateY(-1px); }

    /* ── Add / Edit form box ────────────────────────────────── */
    .form-box {
      background: #fff;
      border-radius: 18px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(15,23,42,.05);
      border: 1px solid #eef3fa;
      overflow: hidden;
    }
    .form-body { padding: 28px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .form-group { display: flex; flex-direction: column; }
    .form-group label {
      font-size: 13px; font-weight: 700; margin-bottom: 8px;
      color: #334155; letter-spacing: .3px;
    }
    .required { color: #ef4444; }
    .form-group input,
    .form-group select,
    .form-group textarea {
      border: 1.5px solid #dbe2ef; border-radius: 12px;
      padding: 12px 16px; font-size: 14px; font-family: inherit;
      outline: none; background: #fff; color: #0f172a;
      transition: border-color .2s, box-shadow .2s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .form-desc { margin-bottom: 22px; }
    .btn-row { display: flex; gap: 12px; }
    .save-btn {
      background: linear-gradient(135deg, #17365d, #2563eb);
      color: #fff; border: none; padding: 12px 26px; border-radius: 12px;
      font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: opacity .2s;
    }
    .save-btn:hover { opacity: .88; }
    .cancel-btn {
      background: #fff; border: 1.5px solid #dbe2ef; color: #334155;
      padding: 12px 26px; border-radius: 12px; font-family: inherit;
      font-size: 14px; font-weight: 600; cursor: pointer; transition: background .18s;
    }
    .cancel-btn:hover { background: #f8fafc; }

    /* ── Category filter tabs ────────────────────────────────── */
    .filter-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .filter-tab {
      padding: 9px 20px;
      border-radius: 30px;
      border: 1.5px solid #dbe2ef;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all .18s;
    }
    .filter-tab:hover { border-color: #2563eb; color: #2563eb; }
    .filter-tab.active {
      background: linear-gradient(135deg, #17365d, #2563eb);
      border-color: transparent;
      color: #fff;
    }

    /* ── Event card ──────────────────────────────────────────── */
    .event-card {
      background: #fff;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(15,23,42,.05);
      border: 1px solid #eef3fa;
      border-left: 4px solid #2563eb;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      transition: transform .18s, box-shadow .18s;
    }
    .event-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(15,23,42,.09); }

    /* Border colour by category */
    .event-card.cat-performance { border-left-color: #7c3aed; }
    .event-card.cat-company     { border-left-color: #059669; }
    .event-card.cat-deadline    { border-left-color: #dc2626; }
    .event-card.cat-townhall    { border-left-color: #0891b2; }
    .event-card.cat-other       { border-left-color: #64748b; }
    .event-card.past            { opacity: .7; }

    .event-left { flex: 1; }
    .event-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .event-title { font-size: 16px; font-weight: 700; color: #0f172a; }

    /* Category badge */
    .cat-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-performance { background: #ede9fe; color: #7c3aed; }
    .badge-company     { background: #dcfce7; color: #059669; }
    .badge-deadline    { background: #fee2e2; color: #dc2626; }
    .badge-townhall    { background: #e0f2fe; color: #0891b2; }
    .badge-other       { background: #f1f5f9; color: #64748b; }

    .event-meta { font-size: 13px; color: #64748b; margin-bottom: 8px; }
    .event-desc { font-size: 14px; color: #334155; line-height: 1.6; }

    .event-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      min-width: 130px;
    }

    /* Status chips */
    .chip {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .chip-today   { background: #dcfce7; color: #16a34a; }
    .chip-passed  { background: #f1f5f9; color: #64748b; }
    .chip-soon    { background: #fff7ed; color: #d97706; }
    .chip-future  { background: #e0f2fe; color: #0891b2; }

    .action-btns { display: flex; gap: 8px; }
    .edit-btn {
      padding: 7px 16px; border-radius: 8px; border: 1.5px solid #dbe2ef;
      background: #fff; color: #334155; font-family: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background .18s;
    }
    .edit-btn:hover { background: #f8fafc; }
    .del-btn {
      padding: 7px 16px; border-radius: 8px; border: 1.5px solid #fee2e2;
      background: #fff; color: #dc2626; font-family: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background .18s;
    }
    .del-btn:hover { background: #fee2e2; }

    /* ── Empty state ─────────────────────────────────────────── */
    .no-events {
      background: #fff;
      border: 2px dashed #dbe4f0;
      border-radius: 18px;
      padding: 64px 20px;
      text-align: center;
    }
    .no-events i  { font-size: 52px; color: #94a3b8; margin-bottom: 16px; display: block; }
    .no-events h2 { font-size: 22px; margin-bottom: 10px; color: #1e2a47; font-weight: 700; }
    .no-events p  { color: #64748b; font-size: 14px; }

    /* ── Edit modal ──────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 20px; padding: 32px;
      width: 100%; max-width: 580px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: modalIn .2s ease;
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes modalIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .modal h2 { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 22px; }
    .modal .form-grid { grid-template-columns: 1fr 1fr; }

    /* ── Toast ───────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 28px; right: 28px; z-index: 9999;
      padding: 14px 22px; border-radius: 12px; font-size: 14px; font-weight: 600;
      color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.15);
      transform: translateY(80px); opacity: 0;
      transition: transform .3s ease, opacity .3s ease;
    }
    .toast.show    { transform: translateY(0); opacity: 1; }
    .toast.success { background: #16a34a; }
    .toast.error   { background: #dc2626; }

    /* ── Footer ──────────────────────────────────────────────── */
    .footer {
      width: 100%; background: #041c3b; color: rgba(255,255,255,.85);
      padding: 20px 40px; display: flex; justify-content: space-between;
      align-items: center; margin-top: 48px; font-size: 13.5px;
    }
    .footer-links { display: flex; gap: 30px; }
    .footer-links a { color: rgba(255,255,255,.75); text-decoration: none; font-size: 13.5px; transition: color .2s; }
    .footer-links a:hover { color: #fff; }

    @media (max-width: 640px) {
      .form-grid { grid-template-columns: 1fr; }
      .event-card { flex-direction: column; }
      .event-right { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<div id="sidebar-container"></div>

<div class="main">

  <!-- Topbar -->
  <header class="topbar">
    <h1 class="topbar-title">Important Events</h1>
    <div class="topbar-right">
      <span class="topbar-date" id="topbarDate"></span>
      <div class="notif-btn" title="Notifications">🔔<span class="notif-badge" id="notifCount">3</span></div>
      <div class="avatar-top" id="topbarAvatar">MV</div>
    </div>
  </header>

  <div class="content">

    <!-- ── Add Event strip ── -->
    <div class="top-strip">
      <h2>Add New Event</h2>
      <button class="add-btn" id="addBtn">+ Add Event</button>
    </div>

    <!-- ── Add Event form (hidden by default) ── -->
    <div class="form-box" id="formBox" style="display:none;">
      <div class="form-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Event Title <span class="required">*</span></label>
            <input type="text" id="evTitle" placeholder="e.g. Q2 Town Hall, Appraisal Deadline" required />
          </div>
          <div class="form-group">
            <label>Category <span class="required">*</span></label>
            <select id="evCategory">
              <option value="Performance Review">Performance Review</option>
              <option value="Company Event">Company Event</option>
              <option value="Deadline">Deadline</option>
              <option value="Town Hall">Town Hall</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Event Date <span class="required">*</span></label>
            <input type="date" id="evDate" required />
          </div>
          <div class="form-group">
            <label>Visible To</label>
            <select id="evVisibility">
              <option value="All Employees">All Employees</option>
              <option value="HR Only">HR Only</option>
              <option value="Managers Only">Managers Only</option>
            </select>
          </div>
        </div>
        <div class="form-group form-desc">
          <label>Description <span style="color:#94a3b8;font-weight:400;">(optional)</span></label>
          <textarea id="evDescription" placeholder="Details about this event..."></textarea>
        </div>
        <div class="btn-row">
          <button class="save-btn" id="saveEventBtn">Save Event</button>
          <button class="cancel-btn" id="cancelEventBtn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- ── Category filter tabs ── -->
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">All Events</button>
      <button class="filter-tab" data-filter="Performance Review">Performance Review</button>
      <button class="filter-tab" data-filter="Company Event">Company Event</button>
      <button class="filter-tab" data-filter="Deadline">Deadline</button>
      <button class="filter-tab" data-filter="Town Hall">Town Hall</button>
      <button class="filter-tab" data-filter="Other">Other</button>
    </div>

    <!-- ── Events list ── -->
    <div id="eventsList"></div>

  </div><!-- /content -->

  <div class="footer">
    <div>© 2026 My Ecstasy . All rights reserved.</div>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms &amp; Conditions</a>
      <a href="#">Cookies</a>
    </div>
  </div>

</div><!-- /main -->

<!-- ── Edit Modal ── -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2>✏️ Edit Event</h2>
    <input type="hidden" id="editId" />
    <div class="form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;">
      <div class="form-group">
        <label>Event Title <span class="required">*</span></label>
        <input type="text" id="editTitle" required />
      </div>
      <div class="form-group">
        <label>Category <span class="required">*</span></label>
        <select id="editCategory">
          <option value="Performance Review">Performance Review</option>
          <option value="Company Event">Company Event</option>
          <option value="Deadline">Deadline</option>
          <option value="Town Hall">Town Hall</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Event Date <span class="required">*</span></label>
        <input type="date" id="editDate" required />
      </div>
      <div class="form-group">
        <label>Visible To</label>
        <select id="editVisibility">
          <option value="All Employees">All Employees</option>
          <option value="HR Only">HR Only</option>
          <option value="Managers Only">Managers Only</option>
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:22px;">
      <label>Description <span style="color:#94a3b8;font-weight:400;">(optional)</span></label>
      <textarea id="editDescription" style="min-height:90px;"></textarea>
    </div>
    <div class="btn-row">
      <button class="save-btn" id="saveEditBtn">Save Changes</button>
      <button class="cancel-btn" id="closeEditBtn">Cancel</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
  // ── Topbar date ───────────────────────────────────────────────────────────
  const _days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const _months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const _now    = new Date();
  document.getElementById('topbarDate').textContent =
    `${_days[_now.getDay()]}, ${_now.getDate()} ${_months[_now.getMonth()]} ${_now.getFullYear()}`;

  // ── Sidebar ───────────────────────────────────────────────────────────────
  (async () => {
    try {
      const res  = await fetch('sidebar.html');
      const html = await res.text();
      document.getElementById('sidebar-container').innerHTML = html;
      const currentPath = location.pathname.replace(/\.html$/, '').toLowerCase();
      document.querySelectorAll('#sidebar-container .nav-item').forEach(a => {
        const href = (a.getAttribute('href') || '').replace(/\.html$/, '').toLowerCase();
        if (href && (currentPath === href || currentPath.endsWith(href))) a.classList.add('active');
      });
    } catch { /* sidebar optional */ }
  })();

  // ═════════════════════════════════════════════════════════════════════════
  //  STATE
  // ═════════════════════════════════════════════════════════════════════════
  let allEvents    = [];
  let activeFilter = 'all';

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  // ── Load profile for topbar avatar ───────────────────────────────────────
  (async () => {
    try {
      const res = await fetch('/api/profile');
      if (!res.ok) return;
      const user = await res.json();
      if (user.fullName) {
        const parts    = user.fullName.trim().split(' ');
        const initials = (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
        document.getElementById('topbarAvatar').textContent = initials;
      }
    } catch {}
  })();

  // ── Category helpers ──────────────────────────────────────────────────────
  const CAT_CLASS = {
    'Performance Review': 'cat-performance',
    'Company Event':      'cat-company',
    'Deadline':           'cat-deadline',
    'Town Hall':          'cat-townhall',
    'Other':              'cat-other'
  };

  const CAT_BADGE = {
    'Performance Review': 'badge-performance',
    'Company Event':      'badge-company',
    'Deadline':           'badge-deadline',
    'Town Hall':          'badge-townhall',
    'Other':              'badge-other'
  };

  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  }

  function getStatusChip(eventDate) {
    const today     = new Date();
    today.setHours(0, 0, 0, 0);
    const evDate    = new Date(eventDate);
    evDate.setHours(0, 0, 0, 0);
    const diffDays  = Math.round((evDate - today) / (1000 * 60 * 60 * 24));

    if (diffDays === 0)  return `<span class="chip chip-today">Today!</span>`;
    if (diffDays < 0)   return `<span class="chip chip-passed">Passed</span>`;
    if (diffDays <= 7)  return `<span class="chip chip-soon">In ${diffDays} day${diffDays !== 1 ? 's' : ''}</span>`;
    return `<span class="chip chip-future">In ${diffDays} days</span>`;
  }

  // ── Load events from API ──────────────────────────────────────────────────
  async function loadEvents() {
    try {
      const url  = activeFilter === 'all'
        ? '/api/events'
        : `/api/events?category=${encodeURIComponent(activeFilter)}`;
      const res  = await fetch(url);
      const data = await res.json();

      if (!res.ok) { console.error('Load events failed:', data.error); return; }

      allEvents = data.events || [];
      renderEvents();
    } catch (err) {
      console.error('loadEvents error:', err);
    }
  }

  // ── Render events list ────────────────────────────────────────────────────
  function renderEvents() {
    const container = document.getElementById('eventsList');

    if (!allEvents.length) {
      container.innerHTML = `
        <div class="no-events">
          <i class="far fa-calendar-alt"></i>
          <h2>No events found</h2>
          <p>No events for this category. Click "+ Add Event" to create one.</p>
        </div>`;
      return;
    }

    container.innerHTML = allEvents.map(ev => {
      const catClass  = CAT_CLASS[ev.category]  || 'cat-other';
      const badgeCls  = CAT_BADGE[ev.category]  || 'badge-other';

      const today    = new Date(); today.setHours(0,0,0,0);
      const evDate   = new Date(ev.eventDate); evDate.setHours(0,0,0,0);
      const isPast   = evDate < today;

      const dateStr  = evDate.toISOString().split('T')[0]; // YYYY-MM-DD for the edit form

      return `
        <div class="event-card ${catClass}${isPast ? ' past' : ''}">
          <div class="event-left">
            <div class="event-title-row">
              <span class="event-title">${escHtml(ev.title)}</span>
              <span class="cat-badge ${badgeCls}">${escHtml(ev.category)}</span>
            </div>
            <div class="event-meta">
              ${formatDate(ev.eventDate)} · Added by ${escHtml(ev.creatorName)}
            </div>
            ${ev.description
              ? `<div class="event-desc">${escHtml(ev.description)}</div>`
              : ''}
          </div>
          <div class="event-right">
            ${getStatusChip(ev.eventDate)}
            <div class="action-btns">
              <button class="edit-btn" data-id="${ev._id}">Edit</button>
              <button class="del-btn"  data-id="${ev._id}">Delete</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Filter tabs ───────────────────────────────────────────────────────────
  document.getElementById('filterTabs').addEventListener('click', async (e) => {
    const btn = e.target.closest('.filter-tab');
    if (!btn) return;
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    await loadEvents();
  });

  // ── Show / hide Add form ──────────────────────────────────────────────────
  document.getElementById('addBtn').addEventListener('click', () => {
    document.getElementById('formBox').style.display = 'block';
    document.getElementById('addBtn').style.display = 'none';
  });

  document.getElementById('cancelEventBtn').addEventListener('click', () => {
    document.getElementById('formBox').style.display = 'none';
    document.getElementById('addBtn').style.display = '';
    clearAddForm();
  });

  function clearAddForm() {
    document.getElementById('evTitle').value       = '';
    document.getElementById('evCategory').value    = 'Performance Review';
    document.getElementById('evDate').value         = '';
    document.getElementById('evVisibility').value  = 'All Employees';
    document.getElementById('evDescription').value = '';
  }

  // ── Submit new event ──────────────────────────────────────────────────────
  document.getElementById('saveEventBtn').addEventListener('click', async () => {
    const title       = document.getElementById('evTitle').value.trim();
    const category    = document.getElementById('evCategory').value;
    const eventDate   = document.getElementById('evDate').value;
    const visibleTo   = document.getElementById('evVisibility').value;
    const description = document.getElementById('evDescription').value.trim();

    if (!title || !eventDate) {
      showToast('Title and event date are required', 'error');
      return;
    }

    const btn = document.getElementById('saveEventBtn');
    btn.disabled   = true;
    btn.textContent = 'Saving…';

    try {
      const res  = await fetch('/api/events', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ title, category, eventDate, visibleTo, description })
      });
      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || 'Failed to save event', 'error');
      } else {
        showToast('Event added successfully! ✅');
        clearAddForm();
        document.getElementById('formBox').style.display = 'none';
        document.getElementById('addBtn').style.display = '';
        activeFilter = 'all';
        document.querySelectorAll('.filter-tab').forEach(b =>
          b.classList.toggle('active', b.dataset.filter === 'all')
        );
        await loadEvents();
      }
    } catch (err) {
      showToast('Network error. Please try again.', 'error');
    } finally {
      btn.disabled   = false;
      btn.textContent = 'Save Event';
    }
  });

  // ── Event delegation for Edit / Delete buttons ───────────────────────────
  document.getElementById('eventsList').addEventListener('click', (e) => {
    const editBtn = e.target.closest('.edit-btn');
    const delBtn  = e.target.closest('.del-btn');

    if (editBtn) {
      const id = editBtn.dataset.id;
      const ev = allEvents.find(x => x._id === id);
      if (!ev) return;
      const dateStr = new Date(ev.eventDate).toISOString().split('T')[0];
      document.getElementById('editId').value          = ev._id;
      document.getElementById('editTitle').value       = ev.title;
      document.getElementById('editCategory').value    = ev.category;
      document.getElementById('editDate').value        = dateStr;
      document.getElementById('editDescription').value = ev.description || '';
      document.getElementById('editVisibility').value  = ev.visibleTo || 'All Employees';
      document.getElementById('editModal').classList.add('open');
    }

    if (delBtn) {
      handleDelete(delBtn.dataset.id);
    }
  });

  document.getElementById('closeEditBtn').addEventListener('click', () => {
    document.getElementById('editModal').classList.remove('open');
  });

  document.getElementById('editModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  // ── Save edit ─────────────────────────────────────────────────────────────
  document.getElementById('saveEditBtn').addEventListener('click', async () => {
    const id          = document.getElementById('editId').value;
    const title       = document.getElementById('editTitle').value.trim();
    const category    = document.getElementById('editCategory').value;
    const eventDate   = document.getElementById('editDate').value;
    const visibleTo   = document.getElementById('editVisibility').value;
    const description = document.getElementById('editDescription').value.trim();

    if (!title || !eventDate) {
      showToast('Title and event date are required', 'error');
      return;
    }

    const btn = document.getElementById('saveEditBtn');
    btn.disabled   = true;
    btn.textContent = 'Saving…';

    try {
      const res  = await fetch(`/api/events/${id}`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ title, category, eventDate, visibleTo, description })
      });
      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || 'Update failed', 'error');
      } else {
        showToast('Event updated successfully! ✅');
        document.getElementById('editModal').classList.remove('open');
        await loadEvents();
      }
    } catch (err) {
      showToast('Network error. Please try again.', 'error');
    } finally {
      btn.disabled   = false;
      btn.textContent = 'Save Changes';
    }
  });

  // ── Delete event ──────────────────────────────────────────────────────────
  async function handleDelete(id) {
    if (!confirm('Are you sure you want to delete this event?')) return;

    try {
      const res  = await fetch(`/api/events/${id}`, { method: 'DELETE' });
      const data = await res.json();

      if (!res.ok) {
        showToast(data.error || 'Delete failed', 'error');
      } else {
        showToast('Event deleted successfully!');
        await loadEvents();
      }
    } catch (err) {
      showToast('Network error. Please try again.', 'error');
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  window.onload = () => loadEvents();
   // ── Logout ────────────────────────────────────────────────────────────────
  async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  }
</script>

  fetch('footer.html').then(r=>r.text()).then(h=>{
    var fc=document.getElementById('footer-container');
    if(fc) fc.innerHTML=h;
  }).catch(function(){});
</script>
