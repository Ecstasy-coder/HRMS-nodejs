<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Desk · My Ecstasy HR Portal</title>
  <script src="/api-config.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Shared design system -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ── Help Desk page-specific styles ──────────────────────── */

    /* ── Stats Grid ─────────────────────────────────────────── */
    .hd-stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      margin-bottom: 26px;
    }

    @media (max-width: 1100px) { .hd-stats { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { .hd-stats { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px)  { .hd-stats { grid-template-columns: 1fr; } }

    .stat-box {
      background: var(--surface, #fff);
      border-radius: var(--radius, 14px);
      border: 1px solid var(--border, #eef2f6);
      padding: 22px 24px;
      box-shadow: var(--shadow, 0 2px 8px rgba(15,23,42,.06));
      animation: fade-up 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .stat-box:nth-child(1) { animation-delay: 0.04s; }
    .stat-box:nth-child(2) { animation-delay: 0.08s; }
    .stat-box:nth-child(3) { animation-delay: 0.12s; }
    .stat-box:nth-child(4) { animation-delay: 0.16s; }
    .stat-box:nth-child(5) { animation-delay: 0.20s; }

    .stat-box .stat-num {
      font-size: 36px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 6px;
      color: #0f172a;
      font-family: 'Sora', sans-serif;
    }

    .stat-box .stat-num.orange { color: #f59e0b; }
    .stat-box .stat-num.blue   { color: #3b82f6; }
    .stat-box .stat-num.green  { color: #22c55e; }
    .stat-box .stat-num.navy   { color: #0f172a; }

    .stat-box .stat-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #94a3b8;
    }

    /* ── Category Chart Card ─────────────────────────────────── */
    .chart-card {
      background: var(--surface, #fff);
      border-radius: var(--radius, 14px);
      border: 1px solid var(--border, #eef2f6);
      padding: 26px 28px;
      box-shadow: var(--shadow, 0 2px 8px rgba(15,23,42,.06));
      margin-bottom: 26px;
      animation: fade-up 0.45s cubic-bezier(0.16,1,0.3,1) 0.15s both;
    }

    .chart-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 22px;
    }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .cat-row:last-child { margin-bottom: 0; }

    .cat-label {
      width: 160px;
      font-size: 13px;
      color: #374151;
      font-weight: 500;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .cat-bar-wrap {
      flex: 1;
      height: 10px;
      background: #f1f5f9;
      border-radius: 20px;
      overflow: hidden;
    }

    .cat-bar {
      height: 100%;
      background: var(--navy, #0f1c2e);
      border-radius: 20px;
      transition: width 0.9s cubic-bezier(0.16,1,0.3,1);
    }

    .cat-count {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      width: 20px;
      text-align: right;
      flex-shrink: 0;
    }

    /* ── Toolbar ─────────────────────────────────────────────── */
    .hd-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      animation: fade-up 0.4s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }

    .hd-search-wrap {
      position: relative;
      flex: 1;
      max-width: 340px;
      min-width: 180px;
    }

    .hd-search-wrap i {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 16px;
      pointer-events: none;
    }

    #hdSearch {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border: 1.5px solid var(--border, #eef2f6);
      border-radius: var(--radius-sm, 10px);
      outline: none;
      font-family: 'Sora', sans-serif;
      font-size: 13.5px;
      background: var(--surface, #fff);
      color: #111827;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #hdSearch:focus {
      border-color: var(--accent, #4f8ef7);
      box-shadow: 0 0 0 3px var(--accent-glow, rgba(79,142,247,0.12));
    }

    .hd-select {
      padding: 10px 14px;
      border: 1.5px solid var(--border, #eef2f6);
      border-radius: var(--radius-sm, 10px);
      font-family: 'Sora', sans-serif;
      font-size: 13.5px;
      background: var(--surface, #fff);
      color: #374151;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .hd-select:focus { border-color: var(--accent, #4f8ef7); }

    .btn-filter {
      background: var(--navy, #0f1c2e);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-sm, 10px);
      font-family: 'Sora', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .btn-filter:hover { opacity: 0.88; transform: translateY(-1px); }

    .btn-clear {
      background: var(--surface, #fff);
      color: #374151;
      border: 1.5px solid var(--border, #eef2f6);
      padding: 10px 20px;
      border-radius: var(--radius-sm, 10px);
      font-family: 'Sora', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-clear:hover { background: #f8fafc; transform: translateY(-1px); }

    /* ── Tickets Table Card ───────────────────────────────────── */
    .tickets-card {
      background: var(--surface, #fff);
      border-radius: var(--radius, 14px);
      border: 1px solid var(--border, #eef2f6);
      box-shadow: var(--shadow, 0 2px 8px rgba(15,23,42,.06));
      overflow: hidden;
      animation: fade-up 0.45s cubic-bezier(0.16,1,0.3,1) 0.25s both;
    }

    .tickets-card-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border, #eef2f6);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tickets-card-header h3 {
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tickets-card-header h3 span {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      background: #f1f5f9;
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* Table */
    .tickets-table-wrap {
      overflow-x: auto;
    }

    table.tickets-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .tickets-table thead tr {
      border-bottom: 1px solid var(--border, #eef2f6);
      background: #f8fafc;
    }

    .tickets-table th {
      padding: 13px 18px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      white-space: nowrap;
    }

    .tickets-table tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    .tickets-table tbody tr:last-child { border-bottom: none; }
    .tickets-table tbody tr:hover { background: #f8fafc; }

    .tickets-table td {
      padding: 16px 18px;
      color: #111827;
      vertical-align: middle;
    }

    .ticket-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      font-weight: 500;
      color: #374151;
    }

    .ticket-subject {
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 3px;
    }

    .ticket-employee {
      font-size: 12px;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ticket-employee i { font-size: 11px; }

    .assign-dash { color: #d1d5db; font-size: 16px; }

    /* Priority badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-high    { background: #fef3c7; color: #92400e; }
    .badge-medium  { background: #dbeafe; color: #1e40af; }
    .badge-low     { background: #f0fdf4; color: #166534; }
    .badge-open       { background: #dbeafe; color: #1d4ed8; }
    .badge-inprogress { background: #fef9c3; color: #854d0e; }
    .badge-resolved   { background: #dcfce7; color: #15803d; }
    .badge-closed     { background: #f3f4f6; color: #6b7280; }

    /* Category emoji cell */
    .cat-icon { font-size: 17px; }

    /* Row actions */
    .row-action-btn {
      background: none;
      border: 1.5px solid var(--border, #eef2f6);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .row-action-btn.view  { color: #2563eb; border-color: #bfdbfe; }
    .row-action-btn.view:hover  { background: #eff6ff; }
    .row-action-btn.resolve { color: #16a34a; border-color: #bbf7d0; }
    .row-action-btn.resolve:hover { background: #f0fdf4; }
    .row-action-btn.close { color: #6b7280; }
    .row-action-btn.close:hover { background: #f9fafb; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
    }

    .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }
    .empty-state p { font-size: 14px; }

    /* Ticket detail modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,20,38,0.55);
      backdrop-filter: blur(3px);
      z-index: 1000;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 40px 20px;
    }

    .modal-box {
      background: var(--surface, #fff);
      border-radius: var(--radius-lg, 18px);
      width: 100%;
      max-width: 600px;
      animation: modal-in 0.25s cubic-bezier(0.16,1,0.3,1) both;
      margin: auto;
    }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(-16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 26px;
      border-bottom: 1px solid var(--border, #eef2f6);
    }

    .modal-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      border: 1.5px solid var(--border, #eef2f6);
      background: var(--surface, #fff);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #6b7280;
      transition: background 0.15s;
    }

    .icon-btn:hover { background: #f1f5f9; }

    .modal-body { padding: 26px; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 20px;
    }

    .detail-field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .detail-field .detail-val {
      font-size: 13.5px;
      font-weight: 600;
      color: #111827;
    }

    .detail-desc {
      background: #f8fafc;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13.5px;
      color: #374151;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .modal-footer {
      padding: 16px 26px;
      border-top: 1px solid var(--border, #eef2f6);
      display: flex;
      gap: 10px;
    }

    .btn-primary-sm {
      background: linear-gradient(135deg, var(--accent, #4f8ef7), var(--accent-dark, #5b4de8));
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm, 10px);
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(79,142,247,0.25);
    }

    .btn-primary-sm:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(79,142,247,0.35); }

    .btn-secondary-sm {
      background: var(--surface, #fff);
      color: #374151;
      border: 1.5px solid var(--border, #eef2f6);
      padding: 10px 18px;
      border-radius: var(--radius-sm, 10px);
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-secondary-sm:hover { background: #f8fafc; }

    /* Assign dropdown in modal */
    .assign-select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border, #eef2f6);
      border-radius: 10px;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      background: var(--surface, #fff);
      color: #374151;
      outline: none;
      margin-top: 4px;
    }

    .assign-select:focus { border-color: var(--accent, #4f8ef7); }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 28px;
      right: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2000;
    }

    .toast {
      background: #0f1c2e;
      color: #e2eaf5;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      animation: toast-in 0.3s cubic-bezier(0.16,1,0.3,1) both;
      min-width: 260px;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateX(40px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .toast.success i { color: #22c55e; }
    .toast.error   i { color: #f87171; }

    /* Responsive table */
    @media (max-width: 900px) {
      .tickets-table th:nth-child(4),
      .tickets-table td:nth-child(4) { display: none; }
    }

    @media (max-width: 700px) {
      .hd-toolbar { flex-direction: column; align-items: stretch; }
      .hd-search-wrap { max-width: 100%; }
      .tickets-table th:nth-child(3),
      .tickets-table td:nth-child(3) { display: none; }
    }

    @media (max-width: 540px) {
      .detail-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<!-- Sidebar -->
<div id="sidebar-container"></div>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <h1 class="topbar-title">Help Desk — All Tickets</h1>
    <div class="topbar-right">
      <span class="topbar-date" id="currentDate"></span>
      <div class="notif-btn" title="Notifications">
        🔔
        <span class="notif-badge" id="notifCount">5</span>
      </div>
      <div class="avatar-top" id="topbarAvatar">MV</div>
    </div>
  </header>

  <div class="content">

    <!-- Stats -->
    <div class="hd-stats">
      <div class="stat-box">
        <div class="stat-num navy" id="statTotal">—</div>
        <div class="stat-label">Total Tickets</div>
      </div>
      <div class="stat-box">
        <div class="stat-num orange" id="statOpen">—</div>
        <div class="stat-label">Open</div>
      </div>
      <div class="stat-box">
        <div class="stat-num blue" id="statInProgress">—</div>
        <div class="stat-label">In Progress</div>
      </div>
      <div class="stat-box">
        <div class="stat-num green" id="statResolved">—</div>
        <div class="stat-label">Resolved</div>
      </div>
      <div class="stat-box">
        <div class="stat-num navy" id="statAvgTime">—</div>
        <div class="stat-label">Avg Resolution Time</div>
      </div>
    </div>

    <!-- Category Chart -->
    <div class="chart-card">
      <h3>Tickets by Category</h3>
      <div id="categoryChart"></div>
    </div>

    <!-- Toolbar -->
    <div class="hd-toolbar">
      <div class="hd-search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" id="hdSearch" placeholder="Search ticket, subject, employee...">
      </div>
      <select class="hd-select" id="filterStatus">
        <option value="">All Status</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
        <option value="Closed">Closed</option>
      </select>
      <select class="hd-select" id="filterCategory">
        <option value="">All Categories</option>
        <option value="Payroll Issue">Payroll Issue</option>
        <option value="IT Support">IT Support</option>
        <option value="HR Query">HR Query</option>
        <option value="General Complaint">General Complaint</option>
        <option value="Leave & Attendance">Leave &amp; Attendance</option>
      </select>
      <select class="hd-select" id="filterPriority">
        <option value="">All Priority</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
      <button class="btn-filter" onclick="HD.applyFilters()">
        <i class="ti ti-filter"></i> Filter
      </button>
      <button class="btn-clear" onclick="HD.clearFilters()">Clear</button>
    </div>

    <!-- Tickets Table -->
    <div class="tickets-card">
      <div class="tickets-card-header">
        <h3>All Tickets <span id="ticketCountBadge">0</span></h3>
      </div>
      <div class="tickets-table-wrap">
        <table class="tickets-table">
          <thead>
            <tr>
              <th>Ticket #</th>
              <th>Subject / Employee</th>
              <th>Assigned To</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ticketsBody">
            <tr>
              <td colspan="8">
                <div class="empty-state">
                  <i class="ti ti-loader-2 spin"></i>
                  <p>Loading tickets…</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- /content -->

  <!-- Footer -->
  <div id="footer-container"></div>
</main>

<!-- ── TICKET DETAIL MODAL ─────────────────────────────────── -->
<div class="modal-overlay" id="ticketModal" onclick="HD.overlayClose(event)">
  <div class="modal-box">
    <div class="modal-header">
      <h2><i class="ti ti-ticket"></i> Ticket Details</h2>
      <button class="icon-btn" onclick="HD.closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="detail-grid">
        <div class="detail-field">
          <label>Ticket #</label>
          <div class="detail-val" id="mTicketId" style="font-family:'JetBrains Mono',monospace;"></div>
        </div>
        <div class="detail-field">
          <label>Status</label>
          <div class="detail-val" id="mStatus"></div>
        </div>
        <div class="detail-field">
          <label>Employee</label>
          <div class="detail-val" id="mEmployee"></div>
        </div>
        <div class="detail-field">
          <label>Department</label>
          <div class="detail-val" id="mDept"></div>
        </div>
        <div class="detail-field">
          <label>Category</label>
          <div class="detail-val" id="mCategory"></div>
        </div>
        <div class="detail-field">
          <label>Priority</label>
          <div class="detail-val" id="mPriority"></div>
        </div>
        <div class="detail-field">
          <label>Date Submitted</label>
          <div class="detail-val" id="mDate"></div>
        </div>
        <div class="detail-field">
          <label>Assign To</label>
          <select class="assign-select" id="mAssignTo">
            <option value="">— Unassigned —</option>
          </select>
        </div>
      </div>
      <div style="margin-bottom:8px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#94a3b8;">Description</div>
      <div class="detail-desc" id="mDesc"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary-sm" onclick="HD.saveTicket()">
        <i class="ti ti-check"></i> Save Changes
      </button>
      <button class="btn-primary-sm" style="background:linear-gradient(135deg,#22c55e,#16a34a); box-shadow:0 4px 12px rgba(34,197,94,0.25);" onclick="HD.resolveTicket()">
        <i class="ti ti-circle-check"></i> Mark Resolved
      </button>
      <button class="btn-secondary-sm" onclick="HD.closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Scripts -->
<script src="/help-desk.js"></script>

<script>
  /* ── Sidebar + topbar bootstrap ────────────────────────────── */
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.getAttribute('href') === 'help-desk.html') el.classList.add('active');
      });
      // Try populating sidebar user info if available
      if (typeof window.sidebarUser !== 'undefined') {
        document.getElementById('sidebarName').textContent = window.sidebarUser.name || 'HR Admin';
        document.getElementById('sidebarAvatar').textContent = (window.sidebarUser.name || 'HR').substring(0,2).toUpperCase();
      }
    });

  // Topbar date
  const dateEl = document.getElementById('currentDate');
  if (dateEl) {
    dateEl.textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
    });
  }
</script>


<script>
  // Footer loader
  fetch('footer.html').then(r=>r.text()).then(h=>{
    var fc=document.getElementById('footer-container');
    if(fc) fc.innerHTML=h;
  }).catch(function(){});
</script>
<script src="topbar-utils.js"></script>
</body>
</html>
