<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Settings · My Ecstasy HR Portal</title>
  <script src="/api-config.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Shared design system (same as users.html) -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ── Settings page-specific styles ───────────────────────── */

    /* Two column settings layout */
    .settings-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) { .settings-container { grid-template-columns: 1fr; } }

    .settings-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(15,23,42,.06);
      border: 1px solid #eef2f6;
      overflow: hidden;
      transition: box-shadow 0.2s;
      animation: fade-up 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .settings-card:hover { box-shadow: 0 12px 28px rgba(15,23,42,.10); }

    .card-head {
      padding: 20px 26px;
      border-bottom: 1px solid #eef2f6;
      background: #fafcff;
    }

    .card-head h3 {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .card-head h3 i { font-size: 18px; color: var(--accent, #4f8ef7); }

    .card-body { padding: 26px; }

    /* Form elements */
    .form-group { margin-bottom: 20px; }

    .form-label {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #475569;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      background: #ffffff;
      transition: all 0.2s;
      color: #0f172a;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent, #4f8ef7);
      box-shadow: 0 0 0 3px var(--accent-glow, rgba(79,142,247,0.12));
    }

    textarea.form-input { resize: vertical; font-family: 'Sora', sans-serif; }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 600px) { .form-row-2 { grid-template-columns: 1fr; } }

    /* Save / submit buttons */
    .btn-settings-submit {
      background: linear-gradient(135deg, var(--accent, #4f8ef7), var(--accent-dark, #5b4de8));
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(79,142,247,0.25);
      transition: all 0.2s;
    }

    .btn-settings-submit:hover  { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79,142,247,0.35); }
    .btn-settings-submit:active { transform: translateY(0); }
    .btn-settings-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* Password strength bar */
    .pw-strength-bar {
      height: 5px;
      background: #e2e8f0;
      border-radius: 20px;
      margin-top: 10px;
      overflow: hidden;
      position: relative;
    }

    .pw-strength-bar::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      width: 0%;
      transition: width 0.25s ease, background 0.25s ease;
      border-radius: 20px;
    }

    .pw-strength-bar.weak::before   { width: 33%; background: #ef4444; }
    .pw-strength-bar.medium::before { width: 66%; background: #f59e0b; }
    .pw-strength-bar.strong::before { width: 100%; background: #10b981; }

    /* Flash messages */
    .flash-message {
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 22px;
      font-size: 13.5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fade-up 0.25s ease;
    }

    .flash-success { background: #e0f2e9; color: #0b5e42; border-left: 4px solid #10b981; }
    .flash-error   { background: #fee9e6; color: #b91c1c; border-left: 4px solid #ef4444; }

    /* Loading spinner */
    .loading-overlay {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

<!-- Sidebar (same pattern as users.html) -->
<div id="sidebar-container"></div>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <h1 class="topbar-title">Settings</h1>
    <div class="topbar-right">
      <span class="topbar-date" id="currentDate"></span>
      <div class="notif-btn" title="Notifications">
        🔔
        <span class="notif-badge" id="notifCount">3</span>
      </div>
      <div class="avatar-top" id="topbarAvatar">MV</div>
    </div>
  </header>

  <div class="content">

    <!-- Page intro -->
    <div style="margin-bottom:24px;">
      <p style="color:#64748b; font-size:14px;">Manage company details and update your account password.</p>
    </div>

    <!-- Flash message container -->
    <div id="flashContainer"></div>

    <!-- Settings cards -->
    <div class="settings-container">

      <!-- Company Information -->
      <div class="settings-card">
        <div class="card-head">
          <h3><i class="ti ti-building"></i> Company Information</h3>
        </div>
        <div class="card-body">
          <form id="companyForm">
            <div class="form-group">
              <label class="form-label">Company Name</label>
              <input type="text" name="company_name" id="company_name" class="form-input"
                     placeholder="Acme Inc." autocomplete="off">
            </div>
            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="company_email" id="company_email" class="form-input"
                       placeholder="contact@company.com">
              </div>
              <div class="form-group">
                <label class="form-label">Website</label>
                <input type="text" name="company_website" id="company_website" class="form-input"
                       placeholder="www.company.com">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Address</label>
              <textarea name="company_address" id="company_address" class="form-input" rows="3"
                        placeholder="Full company address..."></textarea>
            </div>
            <button type="submit" class="btn-settings-submit" id="saveCompanyBtn">
              <i class="ti ti-device-floppy"></i> Save Settings
            </button>
          </form>
        </div>
      </div>

      <!-- Change Password -->
      <div class="settings-card">
        <div class="card-head">
          <h3><i class="ti ti-lock"></i> Change Password</h3>
        </div>
        <div class="card-body">
          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" name="current_password" id="current_password" class="form-input"
                     placeholder="Enter current password" autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" name="new_password" id="new_password" class="form-input"
                     placeholder="Minimum 8 characters">
              <div class="pw-strength-bar" id="pwStrengthBar"></div>
            </div>
            <div class="form-group">
              <label class="form-label">Confirm Password</label>
              <input type="password" name="confirm_password" id="confirm_password" class="form-input"
                     placeholder="Confirm new password">
            </div>
            <button type="submit" class="btn-settings-submit" id="updatePasswordBtn">
              <i class="ti ti-refresh"></i> Update Password
            </button>
          </form>
        </div>
      </div>

    </div><!-- /settings-container -->

  </div><!-- /content -->

  <!-- Footer -->
  <div id="footer-container"></div>
</main>

<!-- ── SCRIPTS ─────────────────────────────────────────────── -->
<script>
  // Load sidebar
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.getAttribute('href') === 'settings.html') el.classList.add('active');
      });
    });

  // Current date
  const d = new Date();
  const dateEl = document.getElementById('currentDate');
  if (dateEl) dateEl.textContent = d.toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
</script>

<script>
  // ── Settings logic (unchanged from original) ──────────────

  const API_BASE = window.location.origin;

  function showFlash(message, type = 'success') {
    const container = document.getElementById('flashContainer');
    if (!container) return;
    const flashDiv = document.createElement('div');
    flashDiv.className = `flash-message flash-${type}`;
    flashDiv.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span><span>${escapeHtml(message)}</span>`;
    container.innerHTML = '';
    container.appendChild(flashDiv);
    setTimeout(() => { if (flashDiv.parentNode) flashDiv.remove(); }, 4000);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
  }

  // Password strength meter
  const passwordInput = document.getElementById('new_password');
  const strengthBar = document.getElementById('pwStrengthBar');

  if (passwordInput && strengthBar) {
    passwordInput.addEventListener('input', function () {
      const pwd = this.value;
      strengthBar.classList.remove('weak', 'medium', 'strong');
      if (pwd.length === 0) return;
      let strength = 0;
      if (pwd.length >= 8)  strength++;
      if (pwd.length >= 12) strength++;
      if (/[a-z]/.test(pwd)) strength++;
      if (/[A-Z]/.test(pwd)) strength++;
      if (/[0-9]/.test(pwd)) strength++;
      if (/[^a-zA-Z0-9]/.test(pwd)) strength++;
      if (strength <= 2) strengthBar.classList.add('weak');
      else if (strength <= 4) strengthBar.classList.add('medium');
      else strengthBar.classList.add('strong');
    });
  }

  async function loadCompanySettings() {
    try {
      const res = await fetch(`${API_BASE}/api/settings`, { credentials: 'include', headers: { 'Accept': 'application/json' } });
      if (res.ok) {
        const data = await res.json();
        if (data.success && data.data) {
          document.getElementById('company_name').value    = data.data.company_name    || '';
          document.getElementById('company_email').value   = data.data.company_email   || '';
          document.getElementById('company_website').value = data.data.company_website || '';
          document.getElementById('company_address').value = data.data.company_address || '';
        }
      }
    } catch (err) {
      console.warn('Could not load settings, backend might be starting', err);
    }
  }

  const companyForm = document.getElementById('companyForm');
  const saveBtn     = document.getElementById('saveCompanyBtn');

  companyForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="loading-overlay"></span> Saving...';
    const payload = {
      company_name:    document.getElementById('company_name').value,
      company_email:   document.getElementById('company_email').value,
      company_website: document.getElementById('company_website').value,
      company_address: document.getElementById('company_address').value
    };
    try {
      const res = await fetch(`${API_BASE}/api/settings`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (res.ok && result.success) {
        showFlash('✅ Company settings saved successfully!', 'success');
      } else {
        showFlash(result.message || 'Failed to save settings', 'error');
      }
    } catch (err) {
      showFlash('Network error: Could not reach server', 'error');
    } finally {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="ti ti-device-floppy"></i> Save Settings';
    }
  });

  const passwordForm = document.getElementById('passwordForm');
  const passwordBtn  = document.getElementById('updatePasswordBtn');

  passwordForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const currentPw = document.getElementById('current_password').value;
    const newPw     = document.getElementById('new_password').value;
    const confirmPw = document.getElementById('confirm_password').value;
    if (!currentPw) { showFlash('Please enter your current password', 'error'); return; }
    if (newPw.length < 8) { showFlash('New password must be at least 8 characters long', 'error'); return; }
    if (newPw !== confirmPw) { showFlash('New passwords do not match', 'error'); return; }
    passwordBtn.disabled = true;
    passwordBtn.innerHTML = '<span class="loading-overlay"></span> Updating...';
    try {
      // const res = await fetch(`${API_BASE}/api/change-password`, {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify({ current_password: currentPw, new_password: newPw, confirm_password: confirmPw })
      // });

      const res = await fetch(
`${API_BASE}/api/profile/password`,
{
method:"PUT",

headers:{
'Content-Type':'application/json'
},

credentials:'include',

body:JSON.stringify({

currentPassword:currentPw,
newPassword:newPw,
confirmPassword:confirmPw

})

}
);
      const result = await res.json();
      if (res.ok && result.success) {
        showFlash('✅ Password changed successfully!', 'success');
        passwordForm.reset();
        strengthBar.classList.remove('weak', 'medium', 'strong');
      } else {
        showFlash(result.message || 'Password change failed', 'error');
      }
    } catch (err) {
      showFlash('Server error: could not change password', 'error');
    } finally {
      passwordBtn.disabled = false;
      passwordBtn.innerHTML = '<i class="ti ti-refresh"></i> Update Password';
    }
  });

  loadCompanySettings();
 // ── Logout ────────────────────────────────────────────────────────────────
  async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  }
</script>


<script>
  // Footer loader
  fetch('footer.html').then(r=>r.text()).then(h=>{
    var fc=document.getElementById('footer-container');
    if(fc) fc.innerHTML=h;
  }).catch(function(){});
</script>
<script src="topbar-utils.js"></script>
</body>
</html>
