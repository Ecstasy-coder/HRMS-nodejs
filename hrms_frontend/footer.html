<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <style>
        .site-footer {
            margin-left: 232px;
            background: #1a1a2e;
            color: #94a3b8;
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, .06);
        }
        
        .footer-left {
            font-weight: 500;
            color: #64748b;
        }
        
        .footer-left span {
            color: #94a3b8;
            font-weight: 600;
        }
        
        .footer-links {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        
        .footer-links a {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            transition: color .2s ease;
        }
        
        .footer-links a:hover {
            color: #f0a824;
        }
        
        @media (max-width: 992px) {
            .site-footer {
                margin-left: 0;
                flex-direction: column;
                gap: 10px;
                text-align: center;
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <footer class="site-footer" id="site-footer">
        <div class="footer-left">
            © 2026 <span>My Ecstasy</span> . All rights reserved.
        </div>
        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms &amp; Conditions</a>
            <a href="#">Cookies</a>
        </div>
    </footer>
</body>

</html>
