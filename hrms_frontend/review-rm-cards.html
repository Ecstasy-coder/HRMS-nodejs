<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Review RM Cards · My Ecstasy HR Portal</title>
    <script src="/api-config.js"></script>

    <!-- Fonts (same as profile.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tabler Icons (same as profile.html) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />

    <!-- Shared design system — provides: .main .topbar .topbar-title .topbar-right
       .topbar-date .notif-btn .notif-badge .avatar-top .content .panel
       .panel-header .panel-title .panel-sub .btn-primary .btn-ghost
       CSS variables: --navy --navy-light --accent --border --radius --shadow-lg etc. -->
    <link rel="stylesheet" href="common.css" />

    <style>
      /* ─────────────────────────────────────────────────────────────
       PAGE-SPECIFIC STYLES  (layout shell comes from common.css)
    ───────────────────────────────────────────────────────────── */

      /* Font applied to everything on this page */
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Sora", "Inter", system-ui, sans-serif;
      }

      /* ── Filter pills ──────────────────────────────────────────── */
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e0e9f0;
      }

      .filter-btn {
        background: #ffffff;
        border: 1.5px solid #dbe3f0;
        padding: 8px 22px;
        border-radius: 40px;
        font-family: inherit;
        font-weight: 600;
        font-size: 13px;
        color: #2c3e66;
        cursor: pointer;
        transition:
          background 0.18s,
          border-color 0.18s,
          color 0.18s,
          box-shadow 0.18s;
      }
      .filter-btn:hover {
        background: #eef3fc;
        border-color: #96a9c2;
      }
      .filter-btn.active {
        background: linear-gradient(135deg, #1e3a5f, #2563eb);
        color: #ffffff;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(30, 58, 95, 0.28);
      }

      /* ── Cards wrapper ─────────────────────────────────────────── */
      .cards-wrapper {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ── State cards (loading / error / empty) ─────────────────── */
      .loading-state,
      .error-state,
      .empty-state {
        background: #ffffff;
        border-radius: 24px;
        padding: 64px 24px;
        text-align: center;
        border: 1px solid #dce8f0;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.05);
      }
      .empty-icon,
      .loading-icon,
      .error-icon {
        font-size: 60px;
        margin-bottom: 20px;
        opacity: 0.7;
        display: block;
      }
      .loading-state h4,
      .error-state h4,
      .empty-state h4 {
        font-size: 20px;
        font-weight: 700;
        color: #1e2a47;
        margin-bottom: 10px;
      }
      .empty-state p,
      .error-state p {
        color: #5b6e8c;
        font-size: 14px;
        max-width: 360px;
        margin: 0 auto;
        line-height: 1.7;
      }

      .retry-btn {
        margin-top: 20px;
        background: linear-gradient(135deg, #1e3a5f, #2563eb);
        color: #ffffff;
        border: none;
        padding: 10px 26px;
        border-radius: 40px;
        font-family: inherit;
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .retry-btn:hover {
        opacity: 0.88;
      }

      /* ── Individual job card ───────────────────────────────────── */
      .card {
        background: #ffffff;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid #e4eef5;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
        transition:
          transform 0.18s,
          box-shadow 0.18s;
        position: relative;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.09);
      }

      .left-bar {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 6px;
        border-radius: 0;
      }

      .card-content {
        padding: 26px 30px 26px 36px;
      } /* 36px left to clear the left-bar */

      /* card header row */
      .card-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 14px;
        margin-bottom: 22px;
      }

      .user {
        display: flex;
        gap: 14px;
        align-items: center;
      }

      .avatar {
        width: 48px;
        height: 48px;
        background: linear-gradient(135deg, #254e7a, #2563eb);
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-weight: 700;
        font-size: 17px;
        flex-shrink: 0;
      }

      .user-name {
        font-weight: 800;
        font-size: 15px;
        color: #0c1b33;
      }
      .user-role {
        font-size: 12px;
        color: #4b6589;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }

      .avg-rating {
        background: #fef7e0;
        border-radius: 30px;
        padding: 2px 10px;
        font-size: 11px;
        font-weight: 700;
        color: #b85c00;
      }

      .right-top {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* status pills */
      .status {
        padding: 5px 16px;
        border-radius: 40px;
        font-size: 12px;
        font-weight: 700;
        text-transform: capitalize;
      }
      .status.pending {
        background: #fff0db;
        color: #b45309;
        border: 1px solid #ffcd94;
      }
      .status.approved {
        background: #e1f7ea;
        color: #0b5e42;
        border: 1px solid #9ad5b3;
      }
      .status.rejected {
        background: #ffe6e5;
        color: #b91c1c;
        border: 1px solid #f9acaa;
      }

      .rating-box {
        background: #fef6e6;
        border-radius: 40px;
        padding: 4px 14px;
        font-size: 12px;
        font-weight: 700;
        color: #b45309;
      }

      .card-date {
        font-size: 12px;
        font-weight: 600;
        color: #6c7f9e;
      }

      /* two-column info grid inside card */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 18px;
        background: #fafcff;
        border: 1px solid #eef3fa;
        border-radius: 14px;
        padding: 14px 18px;
      }

      .label {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.8px;
        color: #4a627a;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .value {
        font-weight: 700;
        font-size: 14px;
        color: #0f2b42;
      }

      .desc-box {
        background: #f8fafd;
        border-radius: 14px;
        padding: 14px 18px;
        margin: 10px 0 8px;
        line-height: 1.6;
        font-size: 13.5px;
        color: #1f3a57;
        border: 1px solid #eef3fa;
      }

      /* star rating */
      .stars {
        display: flex;
        flex-direction: row-reverse;
        justify-content: flex-end;
        gap: 5px;
        margin: 16px 0 8px;
      }
      .stars input {
        display: none;
      }
      .stars label {
        font-size: 30px;
        color: #cbd5e1;
        cursor: pointer;
        transition: color 0.15s;
      }
      .stars label:hover,
      .stars label:hover ~ label,
      .stars input:checked ~ label {
        color: #f5b042;
      }

      /* feedback textarea */
      textarea {
        width: 100%;
        border: 1.5px solid #dbe3f0;
        border-radius: 14px;
        padding: 12px 16px;
        font-size: 13px;
        font-family: inherit;
        resize: vertical;
        margin-top: 10px;
        background: #ffffff;
        color: #0f172a;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      /* approve / reject buttons */
      .buttons {
        display: flex;
        gap: 12px;
        margin: 14px 0 4px;
      }

      .btn {
        border: none;
        padding: 10px 22px;
        border-radius: 40px;
        font-family: inherit;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          background 0.18s;
      }
      .approve-btn {
        background: linear-gradient(135deg, #1f8a4c, #16a34a);
        color: #fff;
      }
      .approve-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(16, 163, 74, 0.3);
      }
      .reject-btn {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        color: #fff;
      }
      .reject-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(220, 38, 38, 0.3);
      }

      /* reviewed footer inside card */
      .reviewed {
        margin-top: 18px;
        padding-top: 14px;
        font-size: 12.5px;
        color: #6c86a3;
        border-top: 1px solid #edf2f7;
        font-weight: 500;
      }

      /* ── Responsive tweaks ─────────────────────────────────────── */
      @media (max-width: 680px) {
        .grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .card-content {
          padding: 18px 18px 18px 24px;
        }
        .filter-btn {
          padding: 6px 16px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ── Sidebar injected dynamically (identical pattern to profile.html) ── -->
    <div id="sidebar-container"></div>

    <!-- ── MAIN (common.css gives this margin-left: var(--sidebar-w, 240px)) ── -->
    <div class="main">
      <!-- Topbar -->
      <header class="topbar">
        <h1 class="topbar-title">Review RM Job Cards</h1>
        <div class="topbar-right">
          <span class="topbar-date" id="topbarDate"></span>
          <div class="notif-btn" title="Notifications">
            🔔
            <span class="notif-badge" id="notifCount">3</span>
          </div>
          <div class="avatar-top" id="topbarAvatar">AD</div>
        </div>
      </header>

      <!-- Page content -->
      <div class="content">
        <!-- Filter pills -->
        <div class="filter-bar">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="approved">Approved</button>
          <button class="filter-btn" data-filter="rejected">Rejected</button>
        </div>

        <!-- Cards rendered by JS -->
        <div id="cardsContainer" class="cards-wrapper"></div>
      </div>
      <!-- /content -->
       <div id="footer-container"></div>
    </div>
    <!-- /main -->

    <script>
      // ── Topbar date (same pattern as profile.html) ─────────────────────────────
      const _days = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];
      const _months = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const _now = new Date();
      document.getElementById("topbarDate").textContent =
        `${_days[_now.getDay()]}, ${_now.getDate()} ${_months[_now.getMonth()]} ${_now.getFullYear()}`;

      // ── Sidebar init (exact same IIFE as profile.html) ─────────────────────────
      (async () => {
        try {
          const res = await fetch("sidebar.html");
          const html = await res.text();
          document.getElementById("sidebar-container").innerHTML = html;
          const currentPath = location.pathname
            .replace(/\.html$/, "")
            .toLowerCase();
          document
            .querySelectorAll("#sidebar-container .nav-item")
            .forEach((a) => {
              const href = (a.getAttribute("href") || "")
                .replace(/\.html$/, "")
                .toLowerCase();
              if (href && (currentPath === href || currentPath.endsWith(href)))
                a.classList.add("active");
            });
        } catch {
          /* sidebar optional */
        }
      })();

      // ── Logout (same as profile.html) ─────────────────────────────────────────
      async function logout() {
        await fetch("/api/logout", { method: "POST" });
        window.location.href = "/";
      }

      // ──────────────────────────────────────────────────────────────────────────
      // ORIGINAL BUSINESS LOGIC — UNCHANGED FROM SOURCE FILE
      // ──────────────────────────────────────────────────────────────────────────

      // BACKEND API CONFIGURATION
      // Change this URL to your actual backend endpoint
      // Example: "http://localhost:5000/api/jobcards"
      const API_BASE_URL = "http://localhost:3000/api/jobcards";

      // Global state
      let currentFilter = "all";
      let allJobCards = []; // stores cards fetched from database
      let isLoading = false;
      let apiError = null;

      // Helper: format date + time (ISO -> readable)

      function formatDate(dateStr) {
        if (!dateStr) return "—";

        try {
          const d = new Date(dateStr);

          if (isNaN(d.getTime())) return "—";

          return d.toLocaleString("en-GB", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return "—";
        }
      }

      function formatReviewedDate() {
        return new Date().toLocaleDateString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function capitalize(str) {
        if (!str) return "";
        return str.charAt(0).toUpperCase() + str.slice(1);
      }

      function getInitials(name) {
        if (!name) return "?";
        return name
          .split(" ")
          .map((n) => n[0])
          .join("")
          .toUpperCase()
          .slice(0, 2);
      }

      // Helper to display average rating (could be from DB, fallback)
      function getAvgRatingForRm(rmName, cardAvg) {
        // If the API provides avg_rating field, use it; otherwise fallback to card rating avg or default
        if (cardAvg && typeof cardAvg === "number") return cardAvg;
        // mock default if needed, but we prefer real data
        return 4.0;
      }

      // Escape HTML to prevent XSS
      function escapeHtml(str) {
        if (str == null) return "";
        return String(str).replace(/[&<>"]/g, function (m) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
          }[m];
        });
      }

      // --------------------------------------------------------------
      // FETCH DATA FROM REAL BACKEND (NO DEFAULT MOCK)
      // --------------------------------------------------------------
      async function fetchJobCardsFromBackend() {
        isLoading = true;
        apiError = null;
        renderEmptyOrErrorState(); // show loading

        try {
          const response = await fetch(API_BASE_URL, {
            method: "GET",
            credentials: "include",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
            },
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();

          // Ensure data is array (handles both array responses or {data: [...]})
          let cardsArray = Array.isArray(data)
            ? data
            : data.data && Array.isArray(data.data)
              ? data.data
              : [];

          // Normalize each card to have consistent fields (if backend uses different keys, adapt)
          allJobCards = cardsArray.map((card) => ({
            _id: card._id || card.id || `temp_${Date.now()}`,
            rm_name: card.rm_name || card.managerName || "Unknown Manager",
            department: card.department || "General",
            project_name: card.project_name || card.project || "Untitled",
            hours_worked: card.hours_worked || card.hours || 0,
            work_description: card.work_description || card.description || "",
            work_date: card.work_date || card.date || new Date().toISOString(),
            status: card.status || "pending",
            rating:
              card.rating !== undefined && card.rating !== null
                ? card.rating
                : null,
            comment: card.comment || "",
            avg_rating_display: card.avg_rating || null,
          }));

          isLoading = false;
          renderCardsByFilter();
        } catch (error) {
          console.error("Backend fetch error:", error);
          apiError = error.message;
          isLoading = false;
          renderEmptyOrErrorState();
        }
      }

      // --------------------------------------------------------------
      // UPDATE STATUS (APPROVE/REJECT) via PUT to backend
      // --------------------------------------------------------------
      async function updateJobCardStatus(id, newStatus) {
        // find card
        const card = allJobCards.find((c) => c._id === id);
        if (!card) {
          alert("Card not found in current dataset.");
          return;
        }

        let ratingValue = null;
        let commentText = "";

        if (newStatus === "approved") {
          // get rating from star radio
          const starSelector = `input[name="rating_${id}"]:checked`;
          const selectedRadio = document.querySelector(starSelector);
          if (!selectedRadio) {
            alert("⚠️ Please select a rating (1 to 5 stars) before approving.");
            return;
          }
          ratingValue = parseInt(selectedRadio.value);
          const commentArea = document.getElementById(`comment_${id}`);
          commentText = commentArea ? commentArea.value : "";
        } else if (newStatus === "rejected") {
          const commentArea = document.getElementById(`comment_${id}`);
          commentText = commentArea ? commentArea.value : "";
          ratingValue = null;
        }

        // Optimistically update local state for immediate UI feedback,
        // but we also send to backend. If backend fails, we revert.
        const originalStatus = card.status;
        const originalRating = card.rating;
        const originalComment = card.comment;

        // optimistic update
        card.status = newStatus;
        card.rating = ratingValue;
        card.comment = commentText || "";

        // re-render current view
        renderCardsByFilter();

        try {
          const response = await fetch(`${API_BASE_URL}/${id}`, {
            method: "PUT",

            credentials: "include",

            headers: {
              "Content-Type": "application/json",
              Accept: "application/json",
            },

            body: JSON.stringify({
              status: newStatus,
              rating: ratingValue,
              comment: commentText,
            }),
          });

          if (!response.ok) {
            throw new Error(`Update failed: ${response.status}`);
          }

          const result = await response.json();
          alert(
            `✅ Job card ${newStatus === "approved" ? "approved" : "rejected"} successfully.`,
          );
          // refresh data from backend to stay in sync
          await fetchJobCardsFromBackend();
        } catch (err) {
          console.error("Update error:", err);
          // revert optimistic changes
          card.status = originalStatus;
          card.rating = originalRating;
          card.comment = originalComment;
          renderCardsByFilter();
          alert(`❌ Failed to update: ${err.message}. Please try again.`);
        }
      }

      // --------------------------------------------------------------
      // RENDER LOGIC (cards or empty state based on filter + data)
      // --------------------------------------------------------------
      function renderCardsByFilter() {
        const container = document.getElementById("cardsContainer");
        if (!container) return;

        // Show loading state
        if (isLoading) {
          container.innerHTML = `
              <div class="loading-state">
                  <div class="loading-icon">⏳</div>
                  <h4>Loading job cards...</h4>
                  <p>Fetching data from the server.</p>
              </div>
          `;
          return;
        }

        // Show error state (backend unavailable / no connection)
        if (apiError) {
          container.innerHTML = `
              <div class="error-state">
                  <div class="error-icon">⚠️</div>
                  <h4>Unable to load data</h4>
                  <p>Could not connect to the backend API.<br>Make sure your server is running at:<br> <strong>${API_BASE_URL}</strong></p>
                  <button class="retry-btn" onclick="retryFetch()">⟳ Retry</button>
              </div>
          `;
          return;
        }

        // Filter based on currentFilter
        let filtered = allJobCards;
        if (currentFilter !== "all") {
          filtered = allJobCards.filter(
            (card) => card.status === currentFilter,
          );
        }

        // EMPTY STATE EXACTLY AS REQUESTED (matching screenshot)
        if (filtered.length === 0) {
          let emptyMessage = "";
          if (currentFilter === "pending") {
            emptyMessage = "No pending job cards from reporting managers.";
          } else if (currentFilter === "approved") {
            emptyMessage = "No approved job cards found.";
          } else if (currentFilter === "rejected") {
            emptyMessage = "No rejected job cards.";
          } else {
            emptyMessage = "No pending job cards from reporting managers.";
          }

          container.innerHTML = `
              <div class="empty-state">
                  <div class="empty-icon">📭</div>
                  <h4>No job cards found</h4>
                  <p>${emptyMessage}</p>
              </div>
          `;
          return;
        }

        // Render actual cards from database (no hardcoded mock)
        container.innerHTML = filtered
          .map((card) => {
            let leftBarColor = "#f59e0b";
            if (card.status === "approved") leftBarColor = "#10b981";
            if (card.status === "rejected") leftBarColor = "#ef4444";

            const avgVal = card.avg_rating_display || 4.0;
            const isPending = card.status === "pending";

            let starsHtml = "";
            let ratingDisplayHtml = "";

            if (isPending) {
              starsHtml = `
                  <div class="stars">
                      <input type="radio" id="star5_${card._id}" name="rating_${card._id}" value="5">
                      <label for="star5_${card._id}">★</label>
                      <input type="radio" id="star4_${card._id}" name="rating_${card._id}" value="4">
                      <label for="star4_${card._id}">★</label>
                      <input type="radio" id="star3_${card._id}" name="rating_${card._id}" value="3">
                      <label for="star3_${card._id}">★</label>
                      <input type="radio" id="star2_${card._id}" name="rating_${card._id}" value="2">
                      <label for="star2_${card._id}">★</label>
                      <input type="radio" id="star1_${card._id}" name="rating_${card._id}" value="1">
                      <label for="star1_${card._id}">★</label>
                  </div>
                  <textarea rows="2" id="comment_${card._id}" placeholder="Add feedback (optional)...">${escapeHtml(card.comment || "")}</textarea>
                  <div class="buttons">
                      <button class="btn approve-btn" onclick="updateJobCardStatus('${card._id}', 'approved')">✓ Approve</button>
                      <button class="btn reject-btn" onclick="updateJobCardStatus('${card._id}', 'rejected')">✕ Reject</button>
                  </div>
              `;
            } else {
              let reviewText = "";
              if (card.rating) reviewText = `⭐ ${card.rating}/5 · `;
              if (card.comment)
                reviewText += `"${escapeHtml(card.comment.substring(0, 80))}"`;
              else reviewText += "No additional feedback";
              starsHtml = `
                  <div class="reviewed">
                      📝 Reviewed on ${formatReviewedDate()} · ${reviewText}
                  </div>
              `;
            }

            if (!isPending && card.rating) {
              ratingDisplayHtml = `<div class="rating-box">⭐ ${card.rating}/5</div>`;
            } else if (
              !isPending &&
              !card.rating &&
              card.status !== "pending"
            ) {
              ratingDisplayHtml = `<div class="rating-box">⭐ Not rated</div>`;
            } else {
              ratingDisplayHtml = "";
            }

            return `
              <div class="card" data-status="${card.status}" data-id="${card._id}">
                  <div class="left-bar" style="background: ${leftBarColor};"></div>
                  <div class="card-content">
                      <div class="card-top">
                          <div class="user">
                              <div class="avatar">${getInitials(card.rm_name)}</div>
                              <div>
                                  <div class="user-name">${escapeHtml(card.rm_name)}</div>
                                  <div class="user-role">
                                      Reporting Manager · ${escapeHtml(card.department)}
                                      <span class="avg-rating">⭐ ${avgVal} avg</span>
                                  </div>
                              </div>
                          </div>
                          <div class="right-top">
                              <div class="status ${card.status}">${capitalize(card.status)}</div>
                              ${ratingDisplayHtml}
                              <div class="card-date">${formatDate(card.work_date)}</div>
                          </div>
                      </div>
                      <div class="grid">
                          <div>
                              <div class="label">PROJECT</div>
                              <div class="value">${escapeHtml(card.project_name)}</div>
                          </div>
                          <div>
                              <div class="label">HOURS</div>
                              <div class="value">${card.hours_worked} hours</div>
                          </div>
                      </div>
                      <div class="label">WORK DESCRIPTION</div>
                      <div class="desc-box">${escapeHtml(card.work_description) || "—"}</div>
                      ${starsHtml}
                  </div>
              </div>
          `;
          })
          .join("");
      }

      // Show loading/error without cards
      function renderEmptyOrErrorState() {
        const container = document.getElementById("cardsContainer");
        if (!container) return;
        if (isLoading) {
          container.innerHTML = `
              <div class="loading-state">
                  <div class="loading-icon">⏳</div>
                  <h4>Loading job cards...</h4>
                  <p>Fetching data from the server.</p>
              </div>
          `;
        } else if (apiError) {
          container.innerHTML = `
              <div class="error-state">
                  <div class="error-icon">⚠️</div>
                  <h4>Unable to load data</h4>
                  <p>Could not connect to the backend API.<br>Make sure your server is running at:<br> <strong>${API_BASE_URL}</strong></p>
                  <button class="retry-btn" onclick="retryFetch()">⟳ Retry</button>
              </div>
          `;
        } else {
          // In case of no cards but not loading/error, show empty ( will be handled by renderCardsByFilter later)
          renderCardsByFilter();
        }
      }

      // retry function exposed globally
      window.retryFetch = function () {
        fetchJobCardsFromBackend();
      };

      // Filter handling with real backend data
      function attachFilterEvents() {
        const btns = document.querySelectorAll(".filter-btn");
        btns.forEach((btn) => {
          btn.removeEventListener("click", filterHandler);
          btn.addEventListener("click", filterHandler);
        });
      }

      function filterHandler(e) {
        const btn = e.currentTarget;
        const filterValue = btn.getAttribute("data-filter");
        if (!filterValue) return;

        document
          .querySelectorAll(".filter-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");

        currentFilter = filterValue;
        renderCardsByFilter(); // re-render based on existing fetched data
      }

      // Set today's date in header
      function setTodayDate() {
        const dateElem = document.getElementById("todayDate");
        if (dateElem) {
          const now = new Date();
          const formatted = now.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric",
          });
          dateElem.innerText = formatted;
        }
      }

      // expose global update function for button clicks
      window.updateJobCardStatus = updateJobCardStatus;

      // Initialize: fetch real data from backend & render
      function init() {
        setTodayDate();
        attachFilterEvents();
        fetchJobCardsFromBackend(); // strictly backend data, no default mock
      }

      // start application
      init();
       // ── Logout ────────────────────────────────────────────────────────────────
  async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  }
    </script>
  
<script>
  // Footer loader
  fetch('footer.html').then(r=>r.text()).then(h=>{
    var fc=document.getElementById('footer-container');
    if(fc) fc.innerHTML=h;
  }).catch(function(){});
</script>
<script src="topbar-utils.js"></script>
</body>
