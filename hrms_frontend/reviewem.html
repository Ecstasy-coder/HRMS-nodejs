<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Review Employee Job Cards
    </title>

    <link rel="stylesheet" href="./css/reviewJobCards.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>

<body>

    <div class="layout">

        <div class="sidebar" id="sidebar"></div>
        <div id="topbar-container"></div>
        <div class="main-content">



            <div class="tabs">

                <button class="active-tab" onclick="filterJobs('Pending')">

        Pending

      </button>


                <button onclick="filterJobs('Approved')">

        Approved

      </button>


                <button onclick="filterJobs('Rejected')">

        Rejected

      </button>


                <button onclick="filterJobs('All')">

        All

      </button>

            </div>




            <div id="jobCards">

            </div>

        </div>
        <div id="footer-container"></div>
    </div>

    <script src="./js/reviewJobCards.js">
    </script>

    <!-- TOPBAR IMPORT -->
    <script>
        fetch("topbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("topbar-container").innerHTML = html;

                // ✅ Run AFTER topbar is injected
                const MODULE_MAP = {
                    "manager": {
                        name: "Dashboard",
                        icon: "fas fa-th-large"
                    },
                    "dashboard": {
                        name: "Dashboard",
                        icon: "fas fa-th-large"
                    },
                    "myattendence": {
                        name: "My Attendance",
                        icon: "far fa-calendar-check"
                    },
                    "myleaves": {
                        name: "My Leaves",
                        icon: "far fa-calendar-alt"
                    },
                    "leaveapprovals": {
                        name: "Leave Approvals",
                        icon: "far fa-user"
                    },
                    "reviewem": {
                        name: "Review Employee Job Cards",
                        icon: "far fa-user-circle"
                    },
                    "myjobcards": {
                        name: "My Job Cards",
                        icon: "far fa-file-alt"
                    },
                    "ticket": {
                        name: "Help Desk",
                        icon: "far fa-comment"
                    },
                    "calender": {
                        name: "Holiday Calendar",
                        icon: "far fa-calendar"
                    },
                    "birthdays": {
                        name: "Birthdays",
                        icon: "fas fa-birthday-cake"
                    },
                    "impevents": {
                        name: "Important Events",
                        icon: "far fa-star"
                    },
                    "payslips": {
                        name: "My Payslips",
                        icon: "fas fa-sack-dollar"
                    },
                    "analysis": {
                        name: "Analysis",
                        icon: "fas fa-chart-line"
                    },
                    "aboutus": {
                        name: "About Us",
                        icon: "fas fa-circle-info"
                    },
                    "profile": {
                        name: "My Profile",
                        icon: "fas fa-user"
                    },
                };

                const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                // Set module name + icon
                const slug = decodeURIComponent(location.pathname.split("/").pop()).replace(".html", "").toLowerCase();
                const mod = MODULE_MAP[slug] || MODULE_MAP["dashboard"];
                document.getElementById("topbar-module-name").textContent = mod.name;
                document.getElementById("topbar-icon").className = mod.icon;

                // Set live date
                function setDate() {
                    const d = new Date();
                    document.getElementById("topbar-date").textContent =
                        `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
                }
                setDate();
                setInterval(setDate, 60000);

                // Set avatar from localStorage
                const user = JSON.parse(localStorage.getItem("user") || "{}");
                const username = user.name || user.username || user.fullName || "";
                if (username) {
                    const initials = username.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
                    document.getElementById("topbar-avatar").textContent = initials;
                }
            });
    </script>
    <script>
        fetch('footer.html').then(r => r.text()).then(html => {
            document.getElementById('footer-container').innerHTML = html;
        });
    </script>
</body>

</html>
