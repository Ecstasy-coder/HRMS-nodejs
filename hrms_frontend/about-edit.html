<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit About Us · My Ecstasy HR Portal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Shared design system (same as users.html) -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ── Edit About Us page-specific styles ───────────────────── */

    .edit-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15,23,42,.07);
      border: 1px solid #eef2f6;
      overflow: hidden;
      animation: fade-up 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    .edit-card-header {
      padding: 26px 32px;
      border-bottom: 1px solid #eef2f6;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fafcff;
    }

    .edit-card-header h2 {
      font-size: 22px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.3px;
    }

    .edit-card-header h2 i {
      color: #4f46e5;
      font-size: 22px;
    }

    .edit-card-body {
      padding: 32px;
    }

    /* Form groups */
    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-label::before {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      background: #4f46e5;
      border-radius: 50%;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .form-group:focus-within .form-label { color: #4f46e5; }
    .form-group:focus-within .form-label::before { opacity: 1; }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 14.5px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      transition: all 0.25s ease;
      color: #0f172a;
      resize: vertical;
      outline: none;
    }

    .form-input:hover  { border-color: #cbd5e1; background: #fefefe; }
    .form-input:focus  {
      border-color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79,70,229,.12), 0 0 0 3px rgba(79,70,229,.08);
    }

    .form-input::placeholder { color: #94a3b8; font-weight: 400; font-size: 13.5px; }

    textarea.form-input {
      line-height: 1.6;
      min-height: 52px;
    }

    textarea.form-input::-webkit-scrollbar { width: 5px; }
    textarea.form-input::-webkit-scrollbar-track  { background: #f1f5f9; border-radius: 10px; }
    textarea.form-input::-webkit-scrollbar-thumb  { background: #cbd5e1; border-radius: 10px; }
    textarea.form-input::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Two column row */
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .form-row-2 .form-group { margin-bottom: 0; }

    @media (min-width: 781px) {
      .form-row-2 .form-group textarea { height: calc(100% - 54px); min-height: 100px; }
    }

    /* Action buttons */
    .edit-actions {
      display: flex;
      gap: 14px;
      justify-content: flex-end;
      align-items: center;
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #eef2f6;
    }

    .btn-save {
      background: linear-gradient(135deg, var(--accent, #4f8ef7), var(--accent-dark, #5b4de8));
      color: white;
      border: none;
      padding: 11px 26px;
      border-radius: 40px;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(79,70,229,.25);
      transition: all 0.25s ease;
    }

    .btn-save:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(79,70,229,.35);
    }

    .btn-save:active { transform: translateY(1px); }

    .btn-cancel {
      background: transparent;
      border: 1.5px solid #cbd5e1;
      color: #475569;
      padding: 11px 26px;
      border-radius: 40px;
      font-family: 'Sora', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-cancel:hover {
      background: #f8fafc;
      border-color: #94a3b8;
      color: #0f172a;
      transform: translateY(-1px);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .form-row-2 { grid-template-columns: 1fr; gap: 16px; }
      .edit-actions { flex-direction: column-reverse; align-items: stretch; }
      .btn-save, .btn-cancel { justify-content: center; }
      .edit-card-body { padding: 22px; }
    }
  </style>
</head>

<body>

<!-- Sidebar (same pattern as users.html) -->
<div id="sidebar-container"></div>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <h1 class="topbar-title">Edit About Us</h1>
    <div class="topbar-right">
      <span class="topbar-date" id="currentDate"></span>
      <div class="notif-btn" title="Notifications">
        🔔
        <span class="notif-badge" id="notifCount">3</span>
      </div>
      <div class="avatar-top" id="topbarAvatar">MV</div>
    </div>
  </header>

  <div class="content">

    <div class="edit-card">

      <div class="edit-card-header">
        <h2><i class="ti ti-pencil"></i> Edit About Us Content</h2>
      </div>

      <div class="edit-card-body">
        <form>

          <div class="form-group">
            <label class="form-label">Company Name</label>
            <input id="companyName" type="text" class="form-input" placeholder="Company Name">
          </div>

          <div class="form-group">
            <label class="form-label">Hero Tagline</label>
            <textarea id="heroTagline"  class="form-input" rows="3" placeholder="Enter tagline..."></textarea>
          </div>

          <div class="form-row-2">
            <div class="form-group">
              <label class="form-label">Our Mission</label>
              <textarea id="mission" class="form-input" rows="5"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Our Values</label>
              <textarea id="values" class="form-input" rows="5"></textarea>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Quote 1</label>
            <textarea id="quote1" class="form-input" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Quote 2</label>
            <textarea id="quote2"class="form-input" rows="3"></textarea>
          </div>

          <div class="edit-actions">
            <a href="about-us.html" class="btn-cancel">
              <i class="ti ti-x"></i> Cancel
            </a>
            <button type="button" class="btn-save" onclick="saveAbout()">
              <i class="ti ti-check"></i> Save Changes
            </button>
          </div>

        </form>
      </div>

    </div>

  </div><!-- /content -->

  <!-- Footer -->
  <div id="footer-container"></div>
</main>

<script>
  fetch('footer.html').then(r=>r.text()).then(h=>{
    const fc=document.getElementById('footer-container');
    if(fc) fc.innerHTML=h;
  }).catch(()=>{});
</script>

<script>


// Load sidebar
fetch('sidebar.html')
.then(r => r.text())
.then(html => {
    document.getElementById('sidebar-container').innerHTML = html;

    document.querySelectorAll('.nav-item').forEach(el => {
        if(el.getAttribute('href')==='about-us.html'){
            el.classList.add('active');
        }
    });
});


// Date
const d = new Date();

document.getElementById(
'currentDate'
).textContent =
d.toLocaleDateString(
'en-IN',
{
weekday:'long',
year:'numeric',
month:'long',
day:'numeric'
}
);


// LOAD EXISTING DATA
async function loadAboutData(){

try{

const response=
await fetch(
'/api/about'
);

const result=
await response.json();

if(result.success){

document.getElementById(
'companyName'
).value=
result.data.companyName || "";

document.getElementById(
'heroTagline'
).value=
result.data.heroTagline || "";

document.getElementById(
'mission'
).value=
result.data.mission || "";

document.getElementById(
'values'
).value=
result.data.values || "";

document.getElementById(
'quote1'
).value=
result.data.quote1 || "";

document.getElementById(
'quote2'
).value=
result.data.quote2 || "";

}

}
catch(err){

console.log(err);

}

}


// SAVE DATA
async function saveAbout(){

const data={

companyName:
document.getElementById(
'companyName'
).value,

heroTagline:
document.getElementById(
'heroTagline'
).value,

mission:
document.getElementById(
'mission'
).value,

values:
document.getElementById(
'values'
).value,

quote1:
document.getElementById(
'quote1'
).value,

quote2:
document.getElementById(
'quote2'
).value

};


try{

const response=
await fetch(
'/api/about',
{
method:'POST',

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify(data)

}
);

const result=
await response.json();

if(result.success){

alert(
'Saved Successfully'
);

window.location.href=
'about-us.html';

}
else{

alert(
'Save Failed'
);

}

}
catch(err){

console.log(err);

alert(
'Server Error'
);

}

}


// run automatically
loadAboutData();

</script>

<script src="topbar-utils.js"></script>
</body>
</html>
