<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Company Gallery — My Ecstasy Admin</title>
  <script src="/api-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="admin-common.css"/>
  <style>
    .user-card{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 8px;
    }
    .gallery-hero {
      background: linear-gradient(135deg, #0f1c2e 0%, #1e3a5f 60%, #163260 100%);
      border-radius: var(--radius-lg); padding: 40px 44px; color: #fff;
      position: relative; overflow: hidden; margin-bottom: 28px;
    }
    .gallery-hero::before {
      content: ''; position: absolute; inset: 0;
      background-image: radial-gradient(#ffffff 1px, transparent 1px),
        radial-gradient(#ffffff 1px, transparent 1px);
      background-size: 120px 120px, 180px 180px;
      background-position: 20px 30px, 80px 90px; opacity: .08;
    }
    .hero-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(255,255,255,.7); font-size: 13px; font-weight: 600;
      text-decoration: none; margin-bottom: 16px; position: relative; z-index: 2;
      transition: color .2s;
    }
    .hero-back:hover { color: #fff; }
    .hero-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px; padding: 5px 14px; font-size: 12px; font-weight: 600;
      color: rgba(255,255,255,.9); margin-bottom: 14px; position: relative; z-index: 2;
    }
    .hero-pill .dot { width: 7px; height: 7px; background: #ef4444; border-radius: 50%; }
    .hero-title { font-size: 34px; font-weight: 800; margin-bottom: 8px; position: relative; z-index: 2; }
    .hero-sub { font-size: 14px; color: rgba(255,255,255,.7); max-width: 480px; position: relative; z-index: 2; line-height: 1.6; margin-bottom: 24px; }
    .hero-stats { display: flex; gap: 32px; position: relative; z-index: 2; }
    .hero-stat-val { font-size: 26px; font-weight: 800; }
    .hero-stat-lbl { font-size: 11px; color: rgba(255,255,255,.6); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

    .festival-panel {
      background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border);
      box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden;
    }
    .festival-header {
      display: flex; align-items: center; gap: 16px; padding: 20px 24px;
      cursor: pointer; transition: background .15s;
    }
    .festival-header:hover { background: #f9fafb; }
    .festival-av {
      width: 48px; height: 48px; border-radius: 14px;
      background: var(--navy); display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff; flex-shrink: 0; overflow: hidden;
    }
    .festival-av img { width: 100%; height: 100%; object-fit: cover; }
    .festival-name { font-size: 15px; font-weight: 700; color: #111827; margin-bottom: 3px; }
    .festival-meta { font-size: 12px; color: var(--text-muted); }
    .festival-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
    .pic-count {
      display: flex; align-items: center; gap: 5px; padding: 5px 12px;
      border: 1.5px solid var(--border); border-radius: 20px; font-size: 12px;
      font-weight: 600; color: var(--text-muted);
    }
    .pic-count.has-photos { border-color: #bfdbfe; color: #1d4ed8; background: #eff6ff; }
    .chevron { font-size: 13px; color: var(--text-muted); transition: transform .3s; }
    .festival-panel.open .chevron { transform: rotate(180deg); }

    .photo-grid {
      display: none; padding: 0 24px 24px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px;
    }
    .festival-panel.open .photo-grid { display: grid; }
    .photo-item {
      border-radius: 12px; overflow: hidden; aspect-ratio: 1;
      cursor: pointer; position: relative; background: #f3f4f6;
    }
    .photo-item img {
      width: 100%; height: 100%; object-fit: cover; transition: transform .3s;
    }
    .photo-item:hover img { transform: scale(1.05); }
    .photo-item .overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .photo-item:hover .overlay { opacity: 1; }
    .overlay i { color: #fff; font-size: 22px; }

    .no-photos {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 24px; color: var(--text-muted); gap: 10px;
    }
    .no-photos i { font-size: 40px; opacity: .3; }
    .no-photos p { font-size: 13px; }
    .no-photos code { font-size: 11px; background: #f3f4f6; padding: 2px 8px; border-radius: 4px; }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 9999;
      display: none; align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 10px; object-fit: contain; }
    .lb-close {
      position: fixed; top: 20px; right: 24px; background: rgba(255,255,255,.15);
      border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%;
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lb-close:hover { background: rgba(255,255,255,.3); }
    .lb-nav {
      position: fixed; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,.15);
      border: none; color: #fff; width: 48px; height: 48px; border-radius: 50%;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    .lb-nav:hover { background: rgba(255,255,255,.3); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }
  </style>
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Company Gallery</div>
    <div class="topbar-right">
      <span class="topbar-date" id="dateDisplay"></span>
      <div class="notif-btn"><i class="fa-regular fa-bell"></i></div>
      <div class="top-avatar" id="topAvatar"></div>
    </div>
  </div>

  <div class="content">
    <!-- Hero Banner -->
    <div class="gallery-hero">
      <a href="dashboard.html" class="hero-back"><i class="fa-solid fa-chevron-left"></i> Back to Dashboard</a>
      <div><span class="hero-pill"><span class="dot"></span> ECSTASY SOLUTIONS</span></div>
      <div class="hero-title">Company Gallery</div>
      <div class="hero-sub">Relive our best moments — festivals, celebrations, and the memories that bring us together as one team.</div>
      <div class="hero-stats">
        <div>
          <div class="hero-stat-val" id="statAlbums">—</div>
          <div class="hero-stat-lbl">Albums</div>
        </div>
        <div>
          <div class="hero-stat-val" id="statPhotos">—</div>
          <div class="hero-stat-lbl">Photos</div>
        </div>
        <div>
          <div class="hero-stat-val" id="statYear">2026</div>
          <div class="hero-stat-lbl">Year</div>
        </div>
      </div>
    </div>

    <!-- Festival Albums -->
    <div id="festivalsContainer">
      <div class="empty-state"><i class="fa-solid fa-images"></i><h3>Loading gallery…</h3></div>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()"><i class="fa-solid fa-xmark"></i></button>
  <button class="lb-nav lb-prev" onclick="lbNav(-1)"><i class="fa-solid fa-chevron-left"></i></button>
  <img id="lbImg" src="" alt="">
  <button class="lb-nav lb-next" onclick="lbNav(1)"><i class="fa-solid fa-chevron-right"></i></button>
</div>

<div id="toast"></div>
<script src="admin-utils.js"></script>
<script>
let currentPhotos = [];
let currentPhotoIdx = 0;

(async () => {
  const user = await adminAuthGuard();
  if (!user) return;
  document.getElementById('sidebar').innerHTML = renderAdminSidebar('gallery', user);
  document.getElementById('dateDisplay').textContent = getLiveDate();
  const topAv = document.getElementById('topAvatar');
  topAv.textContent = getInitials(user.fullName);
  if (user.avatar) topAv.innerHTML = `<img src="${user.avatar}" alt="avatar"/>`;
  loadGallery();
})();

async function loadGallery() {
  try {
    const r = await fetch('/api/gallery', { credentials: 'include' });
    const d = await r.json();
    const container = document.getElementById('festivalsContainer');

    const festivals = d.festivals || (Array.isArray(d) ? d : (d.data || []));
    if (!festivals.length) {
      container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-images"></i><h3>No gallery albums yet</h3><p>HR has not created any gallery albums yet.</p></div>`;
      document.getElementById('statAlbums').textContent = '0';
      document.getElementById('statPhotos').textContent = '0';
      return;
    }

    let totalPhotos = 0;
    festivals.forEach(f => totalPhotos += (f.photos || []).length);

    document.getElementById('statAlbums').textContent = festivals.length;
    document.getElementById('statPhotos').textContent = totalPhotos;
    document.getElementById('statYear').textContent = new Date().getFullYear();

    container.innerHTML = festivals.map((f, fi) => {
      const photos = f.photos || [];
      const coverSrc = photos.length ? (photos[0].url || photos[0].path || `/uploads/gallery/${photos[0].filename}`) : null;
      const dateStr = f.date ? new Date(f.date).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }) : '';
      const initText = (f.name || f.title || 'G').slice(0,2).toUpperCase();

      return `
      <div class="festival-panel" id="fp-${fi}">
        <div class="festival-header" onclick="togglePanel(${fi})">
          <div class="festival-av">
            ${coverSrc ? `<img src="${coverSrc}" onerror="this.parentElement.textContent='${initText}'">` : initText}
          </div>
          <div>
            <div class="festival-name">${f.name || f.title || 'Festival'}</div>
            <div class="festival-meta">${dateStr}${dateStr && photos.length ? ' &nbsp;·&nbsp; ' : ''}${photos.length} Photo${photos.length !== 1 ? 's' : ''}</div>
          </div>
          <div class="festival-right">
            <div class="pic-count ${photos.length ? 'has-photos' : ''}">
              <i class="fa-regular fa-images"></i> ${photos.length} pics
            </div>
            <i class="fa-solid fa-chevron-down chevron"></i>
          </div>
        </div>
        <div class="photo-grid" id="pg-${fi}">
          ${photos.length === 0 ? `
            <div class="no-photos" style="grid-column:1/-1;">
              <i class="fa-regular fa-image"></i>
              <p>No photos yet</p>
              <code>Upload via HR Gallery manager</code>
            </div>` :
            photos.map((ph, pi) => {
              const src = ph.url || ph.path || `/uploads/gallery/${ph.filename || ph._id || ph}`;
              return `<div class="photo-item" onclick="openLightbox(${fi},${pi})">
                <img src="${src}" alt="${f.name}" loading="lazy" onerror="this.parentElement.style.background='#f3f4f6'">
                <div class="overlay"><i class="fa-solid fa-expand"></i></div>
              </div>`;
            }).join('')
          }
        </div>
      </div>`;
    }).join('');

    // Store photos per festival for lightbox
    window._festivalData = festivals;

  } catch(e) {
    console.error(e);
    document.getElementById('festivalsContainer').innerHTML =
      `<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i><h3>Error loading gallery</h3><p>${e.message}</p></div>`;
  }
}

function togglePanel(idx) {
  const panel = document.getElementById('fp-' + idx);
  panel.classList.toggle('open');
}

function openLightbox(fIdx, pIdx) {
  const festival = window._festivalData[fIdx];
  const photos = festival.photos || [];
  currentPhotos = photos.map(ph => ph.url || `/api/gallery/${festival._id}/photos/${ph._id || ph}`);
  currentPhotoIdx = pIdx;
  document.getElementById('lbImg').src = currentPhotos[pIdx];
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

function lbNav(dir) {
  currentPhotoIdx = (currentPhotoIdx + dir + currentPhotos.length) % currentPhotos.length;
  document.getElementById('lbImg').src = currentPhotos[currentPhotoIdx];
}

document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target === document.getElementById('lightbox')) closeLightbox();
});

document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'Escape') closeLightbox();
});
</script>
<script src="topbar-utils.js"></script>
</body>
</html>
