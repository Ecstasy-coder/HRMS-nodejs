<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Review HR Job Cards — My Ecstasy Admin</title>
  <script src="/api-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="admin-common.css"/>
    <link rel="stylesheet" href="topbar.css"/>
  <style>
    .user-card{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 8px;
    }
    /* ── Stat row ─────────────────────────────── */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    .kpi-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 22px 28px;
    }
    .kpi-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .kpi-row-inner { display: flex; align-items: baseline; gap: 12px; }
    .kpi-val {
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--gold);
    }
    .kpi-val.dark { color: #111827; }
    .kpi-sub { font-size: 13px; color: var(--text-muted); }

    /* ── Filter tabs ──────────────────────────── */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .ftab {
      padding: 9px 22px;
      border-radius: 50px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      transition: .2s;
    }
    .ftab:hover { border-color: var(--navy); color: var(--navy); }
    .ftab.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    /* ── Job card ─────────────────────────────── */
    .jc-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
      border-left: 5px solid var(--border);
      overflow: hidden;
    }
    .jc-card.pending  { border-left-color: var(--warning); }
    .jc-card.approved { border-left-color: var(--success); }
    .jc-card.rejected { border-left-color: var(--error); }

    .jc-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 24px 0;
      gap: 16px;
    }
    .jc-emp-row { display: flex; align-items: center; gap: 14px; }
    .jc-av {
      width: 46px; height: 46px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .jc-emp-name { font-size: 16px; font-weight: 700; color: #111827; margin-bottom: 2px; }
    .jc-emp-role { font-size: 13px; color: var(--text-muted); }
    .jc-avg-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #fef9c3;
      color: #854d0e;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 700;
      margin-left: 10px;
    }
    .jc-avg-badge i { color: #eab308; font-size: 11px; }
    .jc-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .jc-status-pill {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .pill-pending  { background: #fef9c3; color: #854d0e; }
    .pill-approved { background: #dcfce7; color: #166534; }
    .pill-rejected { background: #fee2e2; color: #991b1b; }
    .jc-date { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    /* ── Body grid ────────────────────────────── */
    .jc-body { padding: 18px 24px 0; }
    .jc-fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .jc-field-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .jc-field-value { font-size: 14px; font-weight: 500; color: #111827; }
    .jc-desc-block { margin-bottom: 16px; }

    /* ── Review section (inline) ──────────────── */
    .jc-review {
      background: #f9fafb;
      border-top: 1px solid #f3f4f6;
      padding: 20px 24px;
    }
    .review-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .review-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      min-width: 100px;
    }
    .stars-inline {
      display: flex;
      gap: 6px;
    }
    .star-btn {
      font-size: 22px;
      color: #d1d5db;
      cursor: pointer;
      transition: color .15s, transform .1s;
      background: none;
      border: none;
      padding: 0;
      line-height: 1;
    }
    .star-btn:hover,
    .star-btn.lit { color: #eab308; }
    .star-btn:hover { transform: scale(1.15); }
    .review-hint {
      font-size: 12px;
      color: #9ca3af;
      font-style: italic;
    }
    .review-comment {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #374151;
      resize: vertical;
      min-height: 80px;
      outline: none;
      transition: border-color .2s;
      background: #fff;
    }
    .review-comment:focus { border-color: var(--navy); }
    .review-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-approve {
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid #bbf7d0;
      background: #f0fdf4;
      color: #15803d;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: .2s;
    }
    .btn-approve:hover { background: #dcfce7; border-color: #86efac; }
    .btn-approve:disabled { opacity: .5; cursor: not-allowed; }
    .btn-reject {
      padding: 10px 22px;
      border-radius: 10px;
      border: 1.5px solid #fecaca;
      background: #fef2f2;
      color: #dc2626;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: .2s;
    }
    .btn-reject:hover { background: #fee2e2; border-color: #fca5a5; }
    .btn-reject:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Done state ───────────────────────────── */
    .jc-done-row {
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      background: #f9fafb;
      border-top: 1px solid #f3f4f6;
    }
    .done-rating { color: #eab308; letter-spacing: 1px; }

    /* ── Comment display ─────────────────────── */
    .jc-comment-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #374151;
      margin-bottom: 0;
    }
    
  </style>
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Admin — Review HR Job Cards</div>
    <div class="topbar-right">
      <span class="topbar-date" id="dateDisplay"></span>
      <div class="notif-btn" title="Notifications">
            🔔
            <span class="notif-badge" id="notifCount">3</span>
          </div>
      <div class="top-avatar" id="topAvatar"></div>
    </div>
  </div>

  <div class="content">

    <!-- KPI row -->
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">HR Cards to Review</div>
        <div class="kpi-row-inner">
          <div class="kpi-val" id="cnt-hr">0</div>
          <div class="kpi-sub">Awaiting your approval</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">RM Cards Pending</div>
        <div class="kpi-row-inner">
          <div class="kpi-val dark" id="cnt-rm">0</div>
          <div class="kpi-sub">With HR</div>
        </div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Employee Cards Pending</div>
        <div class="kpi-row-inner">
          <div class="kpi-val dark" id="cnt-emp">0</div>
          <div class="kpi-sub">With Reporting Manager</div>
        </div>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs">
      <button class="ftab active" onclick="setFilter(this,'pending')">Pending</button>
      <button class="ftab" onclick="setFilter(this,'approved')">Approved</button>
      <button class="ftab" onclick="setFilter(this,'rejected')">Rejected</button>
      <button class="ftab" onclick="setFilter(this,'all')">All</button>
    </div>

    <div id="cardsContainer">
      <div class="empty-state"><i class="fa-regular fa-file-lines"></i><h3>Loading…</h3></div>
    </div>
  </div>
  <div class="footer">
    <div>© 2026 My Ecstasy . All rights reserved.</div>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms & Conditions</a>
      <a href="#">Cookies</a>
    </div>
  </div>
</div>


<div id="toast"></div>
<script src="admin-utils.js"></script>
<script>
let currentFilter = 'pending';
// per-card rating state: { cardId: ratingValue }
const cardRatings = {};

(async () => {
  const user = await adminAuthGuard();
  if (!user) return;
  document.getElementById('sidebar').innerHTML = renderAdminSidebar('review-jobcards', user);
  document.getElementById('dateDisplay').textContent = getLiveDate();
  const topAv = document.getElementById('topAvatar');
  topAv.textContent = getInitials(user.fullName);
  if (user.avatar) topAv.innerHTML = `<img src="${user.avatar}" alt="avatar"/>`;
  startPolling(loadCards, 20000);
})();

function setFilter(el, f) {
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentFilter = f;
  loadCards();
}

/* ── Helpers ─────────────────────────────────────────────── */
function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function getAvgRating(cards, userId) {
  // Get all cards for this user that have a rating
  const rated = cards.filter(c => c.userId === userId && c.rating > 0);
  if (!rated.length) return null;
  const avg = rated.reduce((s, c) => s + c.rating, 0) / rated.length;
  return avg.toFixed(1);
}

/* ── Load cards ──────────────────────────────────────────── */
async function loadCards() {
  try {
    const r = await fetch(`/api/admin/jobcards?filter=${currentFilter}`, { credentials: 'include' });
    const d = await r.json();
    if (!d.success) return;

    document.getElementById('cnt-hr').textContent  = d.counts.hrToReview;
    document.getElementById('cnt-rm').textContent  = d.counts.rmCardsPending;
    document.getElementById('cnt-emp').textContent = d.counts.empCardsPending;

    renderCards(d.cards || [], d.allCards || d.cards || []);
  } catch(e) { console.error(e); }
}

/* ── Render cards ────────────────────────────────────────── */
function renderCards(cards, allCards) {
  const container = document.getElementById('cardsContainer');

  if (!cards.length) {
    const labels = { pending:'pending', approved:'approved', rejected:'rejected', all:'' };
    container.innerHTML = `
      <div class="empty-state">
        <i class="fa-regular fa-file-lines"></i>
        <h3>No ${labels[currentFilter]} job cards</h3>
        <p>No HR job cards ${currentFilter !== 'all' ? 'with status "' + currentFilter + '"' : ''} found.</p>
      </div>`;
    return;
  }

  // Build a user→avg-rating map from all cards in this response
  const userRatings = {};
  cards.forEach(c => {
    if (!userRatings[c.userId]) userRatings[c.userId] = { sum: 0, count: 0 };
    if (c.rating > 0) {
      userRatings[c.userId].sum   += c.rating;
      userRatings[c.userId].count += 1;
    }
  });

  container.innerHTML = cards.map(card => buildCard(card, userRatings)).join('');
}

function buildCard(card, userRatings) {
  const col   = avatarColor(card.employeeName);
  const init  = getInitials(card.employeeName);

  // Status
  const isPending  = card.currentStage !== 'done' && card.status !== 'approved' && card.status !== 'rejected';
  const isApproved = card.status === 'approved' && card.currentStage === 'done';
  const isRejected = card.status === 'rejected' && card.currentStage === 'done';
  const statusKey  = isApproved ? 'approved' : isRejected ? 'rejected' : 'pending';
  const statusPillClass  = { approved:'pill-approved', rejected:'pill-rejected', pending:'pill-pending' }[statusKey];
  const statusPillLabel  = { approved:'Approved', rejected:'Rejected', pending:'Pending' }[statusKey];

  // Stage label shown on card (helps admin understand where it is in workflow)
  const stageMap = {
    employee:    'With RM',
    rm_approved: 'With HR',
    hr_approved: 'Awaiting Admin',
    done:        card.status === 'approved' ? 'Approved' : 'Rejected'
  };
  const stageLabel = stageMap[card.currentStage] || card.currentStage;

  // Avg rating badge for this employee
  const ur = userRatings[card.userId];
  const avgRating = (ur && ur.count > 0) ? (ur.sum / ur.count).toFixed(1) : null;
  const avgBadge  = avgRating
    ? `<span class="jc-avg-badge"><i class="fa-solid fa-star"></i> ${avgRating} avg (${ur.count} card${ur.count !== 1 ? 's' : ''})</span>`
    : '';

  // Review section (only for cards that can be reviewed by admin)
  // Admin can review any card that hasn't been finalized yet
  const canReview = card.currentStage !== 'done' && card.status === 'pending';
  const reviewHtml = canReview ? buildReviewSection(card._id) : buildDoneSection(card);

  return `
  <div class="jc-card ${statusKey}" id="jc-${card._id}">
    <div class="jc-top">
      <div class="jc-emp-row">
        <div class="jc-av" style="background:${col}">${init}</div>
        <div>
          <div class="jc-emp-name">${card.employeeName} ${avgBadge}</div>
          <div class="jc-emp-role">${card.department || 'HR'}</div>
        </div>
      </div>
      <div class="jc-right">
        <span class="jc-status-pill ${statusPillClass}">${statusPillLabel}</span>
        <span class="jc-date">${fmtDate(card.date)}</span>
      </div>
    </div>

    <div class="jc-body">
      <div class="jc-fields">
        <div>
          <div class="jc-field-label">Project</div>
          <div class="jc-field-value">${card.projectName}</div>
        </div>
        <div>
          <div class="jc-field-label">Hours</div>
          <div class="jc-field-value">${card.hoursWorked}.0 hours</div>
        </div>
      </div>
      <div class="jc-desc-block">
        <div class="jc-field-label">Work Description</div>
        <div class="jc-field-value" style="font-weight:400;line-height:1.6;margin-top:4px;">${card.workDescription}</div>
      </div>
      ${card.adminComment ? `<div class="jc-comment-box" style="margin-bottom:16px;"><strong>Admin comment:</strong> ${card.adminComment}</div>` : ''}
    </div>

    ${reviewHtml}
  </div>`;
}

function buildReviewSection(cardId) {
  const r = cardRatings[cardId] || 0;
  const stars = [1,2,3,4,5].map(v => `
    <button class="star-btn ${r >= v ? 'lit' : ''}" 
            id="star-${cardId}-${v}"
            onclick="setRating('${cardId}', ${v})"
            title="${v} star${v > 1 ? 's' : ''}">
      <i class="fa-solid fa-star"></i>
    </button>`).join('');

  return `
  <div class="jc-review" id="review-${cardId}">
    <div class="review-row">
      <span class="review-label">Rate this work:</span>
      <div class="stars-inline">${stars}</div>
      <span class="review-hint" id="hint-${cardId}">Required to approve</span>
    </div>
    <div>
      <textarea class="review-comment" id="comment-${cardId}" placeholder="Add feedback…"></textarea>
    </div>
    <div class="review-actions">
      <button class="btn-approve" id="approve-${cardId}" onclick="submitReview('${cardId}','approved')">
        <i class="fa-solid fa-check"></i> Approve &amp; Rate
      </button>
      <button class="btn-reject" id="reject-${cardId}" onclick="submitReview('${cardId}','rejected')">
        <i class="fa-solid fa-xmark"></i> Reject
      </button>
    </div>
  </div>`;
}

function buildDoneSection(card) {
  const isApproved = card.status === 'approved';
  const icon  = isApproved ? 'fa-circle-check' : 'fa-circle-xmark';
  const color = isApproved ? 'var(--success)' : 'var(--error)';
  const label = isApproved ? 'Approved' : 'Rejected';
  const stars = card.rating > 0
    ? `<span class="done-rating">${'★'.repeat(card.rating)}${'☆'.repeat(5 - card.rating)}</span> (${card.rating}/5)`
    : '';
  return `
  <div class="jc-done-row">
    <i class="fa-solid ${icon}" style="color:${color};font-size:16px;"></i>
    <span style="color:${color};font-weight:700;">${label}</span>
    ${stars ? `<span style="margin-left:8px;">${stars}</span>` : ''}
    ${card.adminComment ? `<span style="margin-left:8px;color:#6b7280;">· ${card.adminComment}</span>` : ''}
  </div>`;
}

/* ── Star rating ─────────────────────────────────────────── */
function setRating(cardId, val) {
  cardRatings[cardId] = val;
  // Update star visuals
  for (let v = 1; v <= 5; v++) {
    const s = document.getElementById(`star-${cardId}-${v}`);
    if (s) s.classList.toggle('lit', v <= val);
  }
  // Update hint
  const hint = document.getElementById(`hint-${cardId}`);
  if (hint) hint.textContent = `${val} star${val > 1 ? 's' : ''} selected`;
}

/* ── Submit review ───────────────────────────────────────── */
async function submitReview(cardId, status) {
  const rating  = cardRatings[cardId] || 0;
  const comment = (document.getElementById(`comment-${cardId}`)?.value || '').trim();

  // Rating required for approval
  if (status === 'approved' && rating === 0) {
    showToast('Please rate this work before approving', 'error');
    // Shake stars
    const review = document.getElementById(`review-${cardId}`);
    if (review) { review.style.outline = '2px solid #ef4444'; setTimeout(() => review.style.outline = '', 1200); }
    return;
  }

  const approveBtn = document.getElementById(`approve-${cardId}`);
  const rejectBtn  = document.getElementById(`reject-${cardId}`);
  if (approveBtn) { approveBtn.disabled = true; approveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…'; }
  if (rejectBtn)  rejectBtn.disabled = true;

  try {
    const r = await fetch(`/api/admin/jobcards/${cardId}/review`, {
      method: 'PUT',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, adminComment: comment, rating })
    });
    const d = await r.json();
    if (d.success) {
      showToast(status === 'approved' ? '✓ Job card approved!' : 'Job card rejected', status === 'approved' ? 'success' : 'default');
      delete cardRatings[cardId];
      loadCards();
    } else {
      showToast(d.error || 'Server error', 'error');
      if (approveBtn) { approveBtn.disabled = false; approveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Approve & Rate'; }
      if (rejectBtn)  { rejectBtn.disabled  = false; }
    }
  } catch(e) {
    showToast('Connection error', 'error');
    if (approveBtn) { approveBtn.disabled = false; approveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Approve & Rate'; }
    if (rejectBtn)  { rejectBtn.disabled  = false; }
  }
}
</script>
<script src="topbar-utils.js"></script>
</body>
</html>
