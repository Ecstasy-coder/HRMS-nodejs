<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HR Leave Requests — My Ecstasy Admin</title>
  <script src="/api-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="admin-common.css"/>
  <link rel="stylesheet" href="topbar.css"/>
  <style>
    .user-card{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 8px;
    }
    .leave-table-wrap { overflow-x: auto; }
    .leave-row { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid #f3f4f6; gap: 16px; }
    .leave-row:last-child { border-bottom: none; }
    .leave-row:hover { background: #fafafa; }
    .lav { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #fff; flex-shrink: 0; }
    .leave-name { font-size: 14px; font-weight: 700; color: #111827; }
    .leave-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .leave-type { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .lt-CL  { background: #eff6ff; color: #1d4ed8; }
    .lt-SL  { background: #fdf4ff; color: #7c3aed; }
    .lt-ML  { background: #fce7f3; color: #9d174d; }
    .lt-LOP { background: #fff7ed; color: #9a3412; }
    .leave-dates { font-size: 13px; color: #374151; min-width: 180px; }
    .leave-days { font-size: 13px; font-weight: 700; color: #111827; min-width: 60px; text-align: center; }
    .leave-reason { font-size: 13px; color: #6b7280; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
    .leave-actions { display: flex; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .act-btn { padding: 7px 14px; border-radius: 8px; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 5px; transition: .2s; }
    .act-approve { background: #f0fdf4; color: #16a34a; border: 1.5px solid #bbf7d0; }
    .act-approve:hover { background: #dcfce7; }
    .act-reject  { background: #fef2f2; color: #dc2626; border: 1.5px solid #fecaca; }
    .act-reject:hover  { background: #fee2e2; }
    .act-view    { background: #f9fafb; color: #374151; border: 1.5px solid var(--border); }
    .act-view:hover { border-color: var(--navy); color: var(--navy); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-pending  { background: var(--warning); }
    .dot-approved { background: var(--success); }
    .dot-rejected { background: var(--error); }
  </style>
</head>
<body>
<div class="sidebar" id="sidebar"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">HR Leave Requests</div>
    <div class="topbar-right">
      <span class="topbar-date" id="dateDisplay"></span>
      <div class="notif-btn" title="Notifications">
            🔔
            <span class="notif-badge" id="notifCount">3</span>
          </div>
      <div class="top-avatar" id="topAvatar" ></div>
    </div>
  </div>

  <div class="content">
    <!-- Stats -->
    <div class="stat-row">
      <div class="stat-card"><div class="stat-value" id="s-total">—</div><div class="stat-label">Total Requests</div></div>
      <div class="stat-card"><div class="stat-value orange" id="s-pending">—</div><div class="stat-label">Pending</div></div>
      <div class="stat-card"><div class="stat-value green" id="s-approved">—</div><div class="stat-label">Approved</div></div>
      <div class="stat-card"><div class="stat-value red" id="s-rejected">—</div><div class="stat-label">Rejected</div></div>
    </div>

    <!-- Panel -->
    <div class="panel">
      <div class="panel-header">
        <div>
          <div class="panel-title">HR Leave Requests</div>
          <div class="panel-sub">Review and approve leave applications from HR team</div>
        </div>
        <div class="filter-tabs">
          <button class="ftab active" onclick="setFilter(this,'Pending')">Pending</button>
          <button class="ftab" onclick="setFilter(this,'Approved')">Approved</button>
          <button class="ftab" onclick="setFilter(this,'Rejected')">Rejected</button>
          <button class="ftab" onclick="setFilter(this,'all')">All</button>
        </div>
      </div>
      <div id="leavesBody">
        <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><h3>Loading…</h3></div>
      </div>
    </div>
  </div>
  <div class="footer">
    <div>© 2026 My Ecstasy . All rights reserved.</div>
    <div class="footer-links">
      <a href="#">Privacy Policy</a>
      <a href="#">Terms & Conditions</a>
      <a href="#">Cookies</a>
    </div>
  </div>
</div>

<!-- Detail / Review Modal -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal" style="max-width:540px;">
    <div class="modal-header">
      <div>
        <div class="modal-title">Leave Request Details</div>
        <div id="modalEmpInfo" style="font-size:13px;color:var(--text-muted);margin-top:2px;"></div>
      </div>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="modalDetails" style="background:#f9fafb;border-radius:12px;padding:18px;margin-bottom:20px;font-size:13.5px;line-height:2;"></div>
    <div id="reviewActions">
      <div class="form-field">
        <label>Comment (optional)</label>
        <textarea id="reviewComment" placeholder="Add a comment for the HR employee…" style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-family:Inter,sans-serif;font-size:13px;resize:vertical;min-height:80px;outline:none;"></textarea>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
        <button class="btn-outline" onclick="closeModal()">Cancel</button>
        <button class="act-btn act-reject" style="padding:10px 20px;font-size:13px;" onclick="submitReview('Rejected')"><i class="fa-solid fa-xmark"></i> Reject</button>
        <button class="act-btn act-approve" style="padding:10px 20px;font-size:13px;" onclick="submitReview('Approved')"><i class="fa-solid fa-check"></i> Approve</button>
      </div>
    </div>
  </div>
  
</div>

<div id="toast"></div>
<script src="admin-utils.js"></script>
<script>
let currentFilter = 'Pending';
let currentLeaveId = null;

(async () => {
  const user = await adminAuthGuard();
  if (!user) return;
  document.getElementById('sidebar').innerHTML = renderAdminSidebar('hr-leaves', user);
  document.getElementById('dateDisplay').textContent = getLiveDate();
  const topAv = document.getElementById('topAvatar');
  topAv.textContent = getInitials(user.fullName);
  if (user.avatar) topAv.innerHTML = `<img src="${user.avatar}" alt="avatar"/>`;
  startPolling(loadLeaves, 20000);
})();

function setFilter(el, f) {
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  currentFilter = f;
  loadLeaves();
}

async function loadLeaves() {
  try {
    const param = currentFilter === 'all' ? 'all' : currentFilter;
    const r = await fetch(`/api/admin/hr-leaves?status=${param}`, { credentials: 'include' });
    const d = await r.json();
    if (!d.success) return;

    const s = d.stats;
    document.getElementById('s-total').textContent    = s.total;
    document.getElementById('s-pending').textContent  = s.pending;
    document.getElementById('s-approved').textContent = s.approved;
    document.getElementById('s-rejected').textContent = s.rejected;

    renderLeaves(d.leaves);
  } catch(e) { console.error(e); }
}

function renderLeaves(leaves) {
  const body = document.getElementById('leavesBody');
  if (!leaves || leaves.length === 0) {
    const label = currentFilter === 'all' ? '' : currentFilter.toLowerCase() + ' ';
    body.innerHTML = `
      <div style="padding: 20px 20px 6px; font-weight:700; color:#374151; font-size:14px;">
        ${currentFilter === 'all' ? 'All' : currentFilter} Leaves
        <span style="font-size:12px;color:var(--text-muted);margin-left:8px;">0 records</span>
      </div>
      <div class="empty-state">
        <i class="fa-solid fa-clipboard-list" style="color:#d1d5db;font-size:40px;"></i>
        <h3>No ${label}HR leave requests</h3>
        <p>There are no ${label}leave requests from HR staff.</p>
      </div>`;
    return;
  }

  const header = `<div style="padding:16px 20px 12px;border-bottom:1px solid #f3f4f6;font-weight:700;color:#374151;font-size:14px;display:flex;align-items:center;justify-content:space-between;">
    <span>${currentFilter === 'all' ? 'All' : currentFilter} Leaves</span>
    <span style="font-size:12px;color:var(--text-muted);">${leaves.length} records</span>
  </div>`;

  body.innerHTML = header + leaves.map(l => {
    const col = avatarColor(l.userFullName);
    const from = formatDate(l.fromDate);
    const to   = formatDate(l.toDate);
    const isPending = l.status === 'Pending';
    return `
    <div class="leave-row fade-up">
      <div class="lav" style="background:${col}">${getInitials(l.userFullName)}</div>
      <div style="min-width:160px;">
        <div class="leave-name">${l.userFullName}</div>
        <div class="leave-meta">${l.userDepartment || ''} ${l.userDesignation ? '· '+l.userDesignation : ''}</div>
      </div>
      <span class="leave-type lt-${l.leaveType}">${l.leaveType}</span>
      <div class="leave-dates"><i class="fa-regular fa-calendar" style="color:#9ca3af;margin-right:5px;"></i>${from} → ${to}</div>
      <div class="leave-days">${l.days} day${l.days !== 1 ? 's' : ''}</div>
      <div class="leave-reason" title="${l.reason}">${l.reason}</div>
      <div style="min-width:90px;text-align:center;">
        <span class="badge-pill badge-${l.status.toLowerCase()}">
          <span class="status-dot dot-${l.status.toLowerCase()}"></span>${l.status}
        </span>
      </div>
      <div class="leave-actions">
        <button class="act-btn act-view" onclick="viewLeave('${l._id}',${isPending})"><i class="fa-solid fa-eye"></i> View</button>
        ${isPending ? `
          <button class="act-btn act-approve" onclick="quickReview('${l._id}','Approved')"><i class="fa-solid fa-check"></i></button>
          <button class="act-btn act-reject"  onclick="quickReview('${l._id}','Rejected')"><i class="fa-solid fa-xmark"></i></button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

let allLeaves = [];
async function viewLeave(id, isPending) {
  // Re-fetch for up-to-date data
  try {
    const r = await fetch(`/api/admin/hr-leaves?status=all`, { credentials: 'include' });
    const d = await r.json();
    allLeaves = d.leaves || [];
    const l = allLeaves.find(x => x._id === id);
    if (!l) return;
    currentLeaveId = id;

    document.getElementById('modalEmpInfo').textContent = `${l.userDepartment || ''} ${l.userDesignation ? '— ' + l.userDesignation : ''}`;
    document.getElementById('modalDetails').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><strong>Employee:</strong> ${l.userFullName}</div>
        <div><strong>Leave Type:</strong> <span class="leave-type lt-${l.leaveType}">${l.leaveType}</span></div>
        <div><strong>From:</strong> ${formatDate(l.fromDate)}</div>
        <div><strong>To:</strong> ${formatDate(l.toDate)}</div>
        <div><strong>Days:</strong> ${l.days}</div>
        <div><strong>Status:</strong> <span class="badge-pill badge-${l.status.toLowerCase()}">${l.status}</span></div>
        <div style="grid-column:1/-1;"><strong>Reason:</strong> ${l.reason}</div>
        ${l.adminComment ? `<div style="grid-column:1/-1;"><strong>Comment:</strong> ${l.adminComment}</div>` : ''}
        ${l.reviewedBy ? `<div style="grid-column:1/-1;"><strong>Reviewed by:</strong> ${l.reviewedBy} on ${formatDate(l.reviewedAt)}</div>` : ''}
      </div>`;

    document.getElementById('reviewComment').value = '';
    document.getElementById('reviewActions').style.display = isPending ? 'block' : 'none';
    document.getElementById('reviewModal').classList.add('open');
  } catch(e) { showToast('Error loading details', 'error'); }
}

function closeModal() { document.getElementById('reviewModal').classList.remove('open'); }

async function quickReview(id, status) {
  currentLeaveId = id;
  await doReview(status, '');
}

async function submitReview(status) {
  const comment = document.getElementById('reviewComment').value.trim();
  await doReview(status, comment);
}

async function doReview(status, comment) {
  try {
    const r = await fetch(`/api/admin/hr-leaves/${currentLeaveId}/review`, {
      method: 'PUT', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status, adminComment: comment })
    });
    const d = await r.json();
    if (d.success) { showToast(d.message, 'success'); closeModal(); loadLeaves(); }
    else showToast(d.error || 'Error', 'error');
  } catch(e) { showToast('Connection error', 'error'); }
}
</script>
<script src="topbar-utils.js"></script>
</body>
</html>
