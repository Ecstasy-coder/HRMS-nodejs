<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Dashboard</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

    <div class="dashboard">

        <div class="topbar">
            <div>
                <h2>HR Dashboard</h2>
                <p id="userInfo"></p>
            </div>

            <button class="logout-btn" onclick="logoutUser()">Logout</button>
        </div>

        <div class="panel">
            <h3>Create Manager / Employee</h3>

            <input type="text" id="newName" placeholder="Name" />
            <input type="email" id="newEmail" placeholder="Email" />
            <input type="password" id="newPassword" placeholder="Password" />

            <input type="text" id="employeeId" placeholder="Employee ID" />
            <input type="text" id="department" placeholder="Department" />
            <input type="text" id="designation" placeholder="Designation" />
            <input type="text" id="phoneNumber" placeholder="Phone Number" />

            <label>Date of Birth</label>
            <input type="date" id="dateOfBirth" />

            <label>Date of Joining</label>
            <input type="date" id="dateOfJoining" />

            <select id="newRole" onchange="toggleManagerField()">
                <option value="">Select Role</option>
                <option value="manager">Manager</option>
                <option value="employee">Employee</option>
            </select>

            <input type="text" id="managerId" placeholder="Manager ID required for Employee" style="display:none;" />

            <button onclick="createUser()">Create User</button>

            <p id="createMessage"></p>
        </div>

    </div>

    <script src="./js/hr.js"></script>

</body>

</html>
