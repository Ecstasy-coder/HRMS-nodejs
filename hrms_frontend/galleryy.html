<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Company Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f4f6fb;
    color:#111827;
}

/* HEADER */

.gallery-header{

    height:90px;

    background:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 50px;

    box-shadow:
    0 2px 20px rgba(0,0,0,.04);

    position:sticky;
    top:0;
    z-index:100;
}

.gallery-title{

    font-size:30px;
    font-weight:800;
}

.back-btn{

    padding:14px 24px;

    border-radius:50px;

    text-decoration:none;

    background:#111827;
    color:#fff;

    font-weight:600;

    transition:.3s;
}

.back-btn:hover{
    transform:translateY(-3px);
}

/* PAGE */

.gallery-page{

    padding:40px;
}

/* GRID */

.gallery-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:28px;
}

/* CARD */

.gallery-card{

    position:relative;

    border-radius:28px;

    overflow:hidden;

    background:#fff;

    box-shadow:
    0 8px 30px rgba(15,23,42,.08);

    transition:.4s ease;
}

.gallery-card:hover{

    transform:
    translateY(-8px)
    scale(1.02);
}

/* IMAGE */

.gallery-card img{

    width:100%;
    height:320px;

    object-fit:cover;

    display:block;

    transition:1s ease;
}

.gallery-card:hover img{
    transform:scale(1.08);
}

/* OVERLAY */

.gallery-overlay{

    position:absolute;
    inset:0;

    background:
    linear-gradient(
    to top,
    rgba(0,0,0,.7),
    transparent);

    display:flex;
    align-items:flex-end;

    padding:24px;

    color:#fff;
}

.gallery-name{

    font-size:22px;
    font-weight:700;
}

/* RESPONSIVE */

@media(max-width:768px){

    .gallery-page{
        padding:20px;
    }

    .gallery-header{
        padding:0 20px;
    }

    .gallery-title{
        font-size:24px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header class="gallery-header">

    <div class="gallery-title">
        Company Gallery
    </div>

    <a href="dashboard.html" class="back-btn">
        ← Back
    </a>

</header>

<!-- PAGE -->

<div class="gallery-page">

    <div class="gallery-grid">

        <!-- IMAGE 1 -->

        <div class="gallery-card">

            <img src="assets/images/2025-12-08.jpg">

            <div class="gallery-overlay">

                <div class="gallery-name">
                    Meeting Room
                </div>

            </div>

        </div>

        <!-- IMAGE 2 -->

        <div class="gallery-card">

            <img src="assets/images/2025-12-09.jpg">

            <div class="gallery-overlay">

                <div class="gallery-name">
                    Office Lobby
                </div>

            </div>

        </div>

        <!-- IMAGE 3 -->

        <div class="gallery-card">

            <img src="assets/images/2026-03-16.jpg">

            <div class="gallery-overlay">

                <div class="gallery-name">
                    Team Workspace
                </div>

            </div>

        </div>

        <!-- IMAGE 4 -->

        <div class="gallery-card">

            <img src="assets/images/2025-12-08.jpg">

            <div class="gallery-overlay">

                <div class="gallery-name">
                    Discussion Area
                </div>

            </div>

        </div>

        <!-- IMAGE 5 -->

        <div class="gallery-card">

            <img src="assets/images/2025-12-09.jpg">

            <div class="gallery-overlay">

                <div class="gallery-name">
                    Conference Hall
                </div>

            </div>

        </div>

        <!-- IMAGE 6 -->

        <div class="gallery-card">

            <img src="assets/images/2026-03-16.jpg">

            <div class="gallery-overlay">

                <div class="gallery-name">
                    Workspace Setup
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
