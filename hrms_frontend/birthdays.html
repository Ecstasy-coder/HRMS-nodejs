    <style>
        /* ── Birthday-specific styles ────────────────────────────── */
        /* Two-column card row */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --primary: #4f46e5;
            --primary2: #2563eb;
            --bg: #f3f6fb;
            --surface: rgba(255, 255, 255, .75);
            --border: rgba(255, 255, 255, .4);
            --shadow: 0 10px 35px rgba(0, 0, 0, .08);
            --text: #0f172a;
            --muted: #64748b;
        }
        
        body {
            font-family: 'Sora', sans-serif;
            background: radial-gradient(circle at top left, #dbeafe 0%, transparent 30%), radial-gradient(circle at bottom right, #ede9fe 0%, transparent 30%), var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }
        /* ===================================================
   LAYOUT
        .wrapper {
            display: grid;
            grid-template-columns: 260px 1fr;
            min-height: 100vh;
        }
        /* ===================================================
   SIDEBAR
=================================================== */
        /* ===================================================
   MAIN
=================================================== */
        
        .main {
            flex: 1;
            padding: 24px;
            margin-left: 280px;
        }
        /* ===================================================
   TOPBAR
=================================================== */
        /* ===================================================



   STATS
=================================================== */
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
            margin-bottom: 28px;
        }
        
        .stat-card {
            position: relative;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 26px;
            display: flex;
            align-items: center;
            gap: 18px;
            backdrop-filter: blur(14px);
            transition: .35s ease;
            box-shadow: var(--shadow);
        }
        
        .stat-card:hover {
            transform: translateY(-8px);
        }
        
        .stat-icon {
            width: 62px;
            height: 62px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
        }
        
        .stat-text h2 {
            font-size: 30px;
            font-weight: 700;
        }
        
        .stat-text p {
            color: var(--muted);
            font-size: 12px;
        }
        /* ===================================================
   PANELS
=================================================== */
        /* ===================================================
   PREMIUM BIRTHDAY PANELS
=================================================== */
        
        .bday-cards-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }
        
        .bday-panel {
            position: relative;
            background: linear-gradient( 135deg, rgba(255, 255, 255, .82), rgba(248, 250, 252, .72));
            backdrop-filter: blur(18px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, .55);
            overflow-y: scroll;
            -webkit-scrollbar-width: none;
            box-shadow: 0 10px 40px rgba(15, 23, 42, .08), inset 0 1px 0 rgba(255, 255, 255, .7);
            animation: fadeUp .5s ease;
            transition: transform .4s ease, box-shadow .4s ease;
        }
        /* PANEL HOVER */
        
        .bday-panel:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 70px rgba(79, 70, 229, .14), inset 0 1px 0 rgba(255, 255, 255, .85);
        }
        /* FLOATING GRADIENTS */
        
        .bday-panel::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient( circle, rgba(99, 102, 241, .18), transparent 70%);
            top: -60px;
            left: -60px;
            animation: floatBlob 8s ease-in-out infinite;
        }
        
        .bday-panel::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient( circle, rgba(251, 191, 36, .18), transparent 70%);
            right: -30px;
            bottom: -30px;
            animation: floatBlob2 10s ease-in-out infinite;
        }
        /* ===================================================
   ROCKET
=================================================== */
        
        .rocket-wrap {
            position: absolute;
            left: -35px;
            bottom: -35px;
            font-size: 75px;
            opacity: .06;
            transform: rotate(-35deg);
            transition: all 2s ease;
            z-index: 0;
        }
        
        .bday-panel:hover .rocket-wrap {
            transform: translate(430px, -600px) rotate(-250deg) scale(.45);
            opacity: .22;
        }
        /* ===================================================
   FLOATING STARS
=================================================== */
        
        .star {
            position: absolute;
            background: radial-gradient( circle, rgba(251, 191, 36, .9), rgba(250, 204, 21, .15));
            clip-path: polygon( 50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            opacity: .16;
            z-index: 0;
        }
        
        .star-1 {
            width: 120px;
            height: 120px;
            left: -35px;
            top: -35px;
            animation: starFloat 8s ease-in-out infinite;
        }
        
        .star-2 {
            width: 90px;
            height: 90px;
            right: -25px;
            bottom: 20px;
            animation: starFloat 12s ease-in-out infinite;
        }
        
        .star-3 {
            width: 20px;
            height: 20px;
            top: 80px;
            right: 120px;
            animation: rotateStar 8s linear infinite;
        }
        
        .star-4 {
            width: 16px;
            height: 16px;
            top: 50%;
            left: 45%;
            animation: rotateStar 6s linear infinite;
        }
        /* ===================================================
   HEADER
=================================================== */
        
        .bday-panel-header {
            position: relative;
            z-index: 2;
            padding: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(226, 232, 240, .6);
            background: rgba(255, 255, 255, .45);
            backdrop-filter: blur(12px);
        }
        
        .bday-panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-left: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .total-badge {
            background: rgb(137 135 142 / 8%);
            color: #100f10;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(79, 70, 229, .12);
        }
        
        .bday-panel-body {
            position: relative;
            z-index: 2;
        }
        /* ===================================================
   ITEMS
=================================================== */
        
        .birthday-item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid rgba(226, 232, 240, .7);
            transition: .3s ease;
            overflow: hidden;
        }
        
        .birthday-item::after {
            content: "✨";
            position: absolute;
            right: 110px;
            top: 50%;
            transform: translateY(-50%) translateX(30px);
            opacity: 0;
            transition: .45s ease;
        }
        
        .birthday-item:hover::after {
            opacity: .75;
            transform: translateY(-50%) translateX(0px) rotate(20deg);
        }
        
        .birthday-item:hover {
            background: linear-gradient( 90deg, rgba(79, 70, 229, .04), transparent);
            transform: scale(1.01);
        }
        
        .bday-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        
        .bday-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50px;
            background: linear-gradient( 135deg, #4f46e5, #2563eb);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(79, 70, 229, .25);
        }
        
        .bday-info strong {
            display: block;
            margin-bottom: 5px;
        }
        
        .bday-info p {
            font-size: 12px;
            color: var(--muted);
        }
        /* ===================================================
   MONTH USERS
=================================================== */
        
        .month-block {
            padding: 22px;
            border-bottom: 1px solid #edf2f7;
        }
        
        .month-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        
        .month-users {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .month-user {

            color: #4338ca;
            padding: 8px 14px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 600;

            border: 1px solid rgba(79, 70, 229, .08);

        .month-user:hover {
            background: #4f46e5;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, .25);
        }
        /* ===================================================
   STATS CARD IMPROVEMENTS
=================================================== */
        
        .stat-card::before {
            content: "";

            inset: 0;
            background: linear-gradient( 135deg, rgba(255, 255, 255, .22), transparent);
            pointer-events: none;
        }
        
        .stat-icon {

        }
        /* ===================================================
   TABLE HOVER
=================================================== */
        
        tbody tr {

            to {

        @keyframes floatBlob {

            100% {

            }
            100% {

        @keyframes starFloat {

            }
            50% {
                transform: translateY(-18px) rotate(12deg);
            }
            100% {

        @keyframes rotateStar {

   TABLE
=================================================== */
        
        .table-panel {
            background: rgba(255, 255, 255, .75);

            border: 1px solid rgba(255, 255, 255, .4);

        .table-panel-header {
            padding: 24px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .table-search {

        }

        }
        
        .table-search input {
            width: 280px;

            border-radius: 14px;
            border: 1px solid #dbe4f0;
            font-family: 'Sora', sans-serif;
        }
        
        .btn-export {
            border: none;
            background: white;
            color: black;
            padding: 10px 15px;
            border: 1px solid rgba(79, 70, 229, .12);
            border-radius: 14px;
            font-family: 'Sora', sans-serif;
            cursor: pointer;
            font-weight: 500;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f8fafc;
        }
        
        thead th {
            padding: 18px;
            font-size: 11px;

        }

        }

    <div class="layout">

    <!-- TOPBAR IMPORT -->
    <script>
        fetch("topbar.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("topbar-container").innerHTML = html;

                // ✅ Run AFTER topbar is injected
                const MODULE_MAP = {
                    "manager": {
                        name: "Dashboard",
                        icon: "fas fa-th-large"
                    },
                    "dashboard": {
                        name: "Dashboard",
                        icon: "fas fa-th-large"
                    },
                    "myattendence": {
                        name: "My Attendance",
                        icon: "far fa-calendar-check"
                    },
                    "myleaves": {
                        name: "My Leaves",
                        icon: "far fa-calendar-alt"
                    },
                    "leaveapprovals": {
                        name: "Leave Approvals",
                        icon: "far fa-user"
                    },
                    "reviewem": {
                        name: "Review Employee Job Cards",
                        icon: "far fa-user-circle"
                    },
                    "myjobcards": {
                        name: "My Job Cards",
                        icon: "far fa-file-alt"
                    },
                    "ticket": {
                        name: "Help Desk",
                        icon: "far fa-comment"
                    },
                    "calender": {
                        name: "Holiday Calendar",
                        icon: "far fa-calendar"
                    },
                    "birthdays": {
                        name: "Birthdays",
                        icon: "fas fa-birthday-cake"
                    },
                    "impevents": {
                        name: "Important Events",
                        icon: "far fa-star"
                    },
                    "payslips": {
                        name: "My Payslips",
                        icon: "fas fa-sack-dollar"
                    },
                    "analysis": {
                        name: "Analysis",
                        icon: "fas fa-chart-line"
                    },
                    "aboutus": {
                        name: "About Us",
                        icon: "fas fa-circle-info"
                    },
                    "profile": {
                        name: "My Profile",
                        icon: "fas fa-user"
                    },
                };

                const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
                const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

                // Set module name + icon
                const slug = decodeURIComponent(location.pathname.split("/").pop()).replace(".html", "").toLowerCase();
                const mod = MODULE_MAP[slug] || MODULE_MAP["dashboard"];
                document.getElementById("topbar-module-name").textContent = mod.name;
                document.getElementById("topbar-icon").className = mod.icon;

                // Set live date
                function setDate() {
                    const d = new Date();
                    document.getElementById("topbar-date").textContent =
                        `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
                }
                setDate();
                setInterval(setDate, 60000);

                // Set avatar from localStorage
                const user = JSON.parse(localStorage.getItem("user") || "{}");
                const username = user.name || user.username || user.fullName || "";
                if (username) {
                    const initials = username.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
                    document.getElementById("topbar-avatar").textContent = initials;
                }
            });
    </script>

</body>
