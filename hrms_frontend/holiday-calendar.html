<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holiday Calendar · My Ecstasy HR Portal</title>
  <script src="/api-config.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Shared design system (same as birthdays.html) -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ── Holiday-Calendar-specific styles ─────────────────────── */

    /* ── Upload panel ─────────────────────────────────────────── */
    .upload-panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 28px;
      animation: fade-up 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .upload-panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 28px;
      border-bottom: 1px solid var(--border);
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
    }
    .upload-panel-header i { font-size: 18px; color: var(--accent); }

    .upload-panel-body { padding: 28px; }

    /* ── Year selector ────────────────────────────────────────── */
    .form-row {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .form-field { display: flex; flex-direction: column; gap: 8px; }
    .form-field label {
      font-size: 13px; font-weight: 600; color: #334155;
    }

    .year-select {
      height: 44px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      padding: 0 16px;
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      color: #111827;
      background: var(--surface);
      outline: none;
      min-width: 160px;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .year-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* ── Drop zone ────────────────────────────────────────────── */
    .drop-zone {
      border: 2px dashed #4f7cff;
      border-radius: 16px;
      background: #f8fbff;
      padding: 40px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 10px;
      transition: background 0.25s, border-color 0.25s;
      cursor: pointer;
      margin-bottom: 24px;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      background: #eef4ff;
      border-color: var(--accent);
    }

    .drop-zone-icon {
      width: 56px; height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f8ef7, #5b4de8);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 6px;
    }
    .drop-zone-icon i { font-size: 26px; color: white; }

    .drop-zone input[type="file"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
      pointer-events: none;
    }

    .drop-title {
      font-size: 17px; font-weight: 700; color: #0f172a;
    }
    .drop-sub {
      font-size: 13px; color: #64748b;
    }

    .selected-file-name {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-dark);
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 6px 14px;
    }
    .selected-file-name.visible { display: inline-flex; }
    .selected-file-name i { font-size: 15px; }

    /* ── Upload button ────────────────────────────────────────── */
    .btn-upload {
      background: linear-gradient(135deg, #173768, #2957a4);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 600;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 6px 16px rgba(23,55,104,0.22);
    }
    .btn-upload:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-upload:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    /* ── Table panel (matches birthdays table-panel) ──────────── */
    .table-panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fade-up 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    .table-panel-header {
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 14px;
    }
    .table-panel-title { font-size: 16px; font-weight: 700; color: var(--navy); }

    .table-count-badge {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px; color: #5f6b85; font-weight: 600;
    }

    /* ── Table ────────────────────────────────────────────────── */
    .cal-table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: var(--surface-alt);
      color: #64748b;
      padding: 14px 18px;
      text-transform: uppercase;
      font-size: 11.5px; font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    thead th:not(:first-child) { text-align: center; }

    tbody td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--surface-alt);
      color: #334155;
      font-size: 13.5px;
      text-align: center;
      vertical-align: middle;
    }
    tbody td:first-child { text-align: left; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-alt); }

    /* ── File cell ────────────────────────────────────────────── */
    .file-cell { display: flex; align-items: center; gap: 14px; }

    .pdf-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: #fee2e2; color: #dc2626;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }

    .file-meta strong {
      display: block; color: #111827;
      font-size: 13.5px; font-weight: 600;
      margin-bottom: 2px;
      word-break: break-word;
    }

    /* ── Badges ───────────────────────────────────────────────── */
    .type-badge {
      display: inline-block;
      background: #eef4ff; color: #2957a4;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 11.5px; font-weight: 700;
    }

    /* ── Row actions ──────────────────────────────────────────── */
    .row-actions { display: flex; justify-content: center; align-items: center; gap: 8px; }

    .btn-view, .btn-dl, .btn-del {
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px; font-weight: 600;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      transition: background 0.2s;
      min-width: 80px;
    }
    .btn-view { background: #e8f1ff; color: #2563eb; }
    .btn-view:hover { background: #dbeafe; }
    .btn-dl   { background: #dcfce7; color: #15803d; }
    .btn-dl:hover { background: #bbf7d0; }
    .btn-del  { background: #fee2e2; color: #dc2626; }
    .btn-del:hover { background: #fecaca; }

    /* ── Empty state ──────────────────────────────────────────── */
    .no-data {
      padding: 48px; text-align: center; color: #64748b; font-size: 14px;
    }
    .no-data i { font-size: 36px; display: block; margin-bottom: 12px; opacity: 0.35; }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      .table-panel-header { flex-direction: column; align-items: flex-start; }
      .form-row { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar-container"></div>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <h1 class="topbar-title">Holiday Calendar</h1>
    <div class="topbar-right">
      <span class="topbar-date" id="todayDate"></span>
      <div class="notif-btn" title="Notifications">
        🔔
        <span class="notif-badge" id="notifCount">5</span>
      </div>
      <div class="avatar-top" id="topbarAvatar">MV</div>
    </div>
  </header>

  <div class="content">

    <!-- Upload Panel -->
    <div class="upload-panel">
      <div class="upload-panel-header">
        <i class="ti ti-cloud-upload"></i>
        Upload New Calendar
      </div>
      <div class="upload-panel-body">

        <div class="form-row">
          <div class="form-field">
            <label for="calendarYear">Calendar Year</label>
            <select id="calendarYear" class="year-select">
              <option value="2026">2026</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
            </select>
          </div>
        </div>

        <!-- Drop Zone -->
        <div class="drop-zone" id="dropZone">
          <input type="file" id="calendarFile" accept=".pdf,.png,.jpg,.jpeg">
          <div class="drop-zone-icon"><i class="ti ti-file-upload"></i></div>
          <div class="drop-title">Drag &amp; Drop File Here or Click to Browse</div>
          <div class="drop-sub">Accepted: PDF, PNG, JPG — Maximum 10 MB</div>
          <span class="selected-file-name" id="selectedFileName">
            <i class="ti ti-file-check"></i>
            <span id="fileNameText"></span>
          </span>
        </div>

        <button class="btn-upload" id="uploadBtn">
          <i class="ti ti-upload"></i> Upload Calendar
        </button>

      </div>
    </div>

    <!-- Uploaded Calendars Table -->
    <div class="table-panel">
      <div class="table-panel-header">
        <div class="table-panel-title">Uploaded Calendars</div>
        <div class="table-count-badge" id="calendarCount">0 files</div>
      </div>
      <div class="cal-table-wrap">
        <table>
          <thead>
            <tr>
              <th>File Name</th>
              <th>Year</th>
              <th>Type</th>
              <th>Size</th>
              <th>Uploaded On</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="calendarTableBody">
            <tr>
              <td colspan="6" class="no-data">
                <i class="ti ti-calendar-off"></i>
                No calendars uploaded yet.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div><!-- /content -->

  <!-- Footer -->
  <div id="footer-container"></div>
</main>

<!-- Toast -->
<div class="toast-container" id="toasts"></div>

<!-- Inline sidebar loader + active-state marker -->
<script>
  /* ── Set today's date in topbar ─────────────────────── */
  const el = document.getElementById('todayDate');
  if (el) {
    el.textContent = new Date().toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
  }

  /* ── Load sidebar HTML ──────────────────────────────── */
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      /* Mark current page active */
      document.querySelectorAll('.nav-item').forEach(a => {
        a.classList.remove('active');
        if (a.getAttribute('href') === 'holiday-calendar.html') {
          a.classList.add('active');
        }
      });
    })
    .catch(() => {
      /* Sidebar failed to load – gracefully skip */
    });

  /* ── Drop zone interactivity ────────────────────────── */
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('calendarFile');
  const selectedFileName = document.getElementById('selectedFileName');
  const fileNameText = document.getElementById('fileNameText');

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      showFileName(e.dataTransfer.files[0].name);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) showFileName(fileInput.files[0].name);
  });

  function showFileName(name) {
    fileNameText.textContent = name;
    selectedFileName.classList.add('visible');
  }
</script>

<!-- Holiday Calendar logic -->
<script src="/holiday-calendar.js"></script>


<script>
  // Footer loader
  fetch('footer.html').then(r=>r.text()).then(h=>{
    var fc=document.getElementById('footer-container');
    if(fc) fc.innerHTML=h;
  }).catch(function(){});
</script>
<script src="topbar-utils.js"></script>
</body>
</html>
