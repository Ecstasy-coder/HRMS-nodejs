<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Us · My Ecstasy HR Portal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Shared design system (same as users.html) -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ── About Us page-specific styles ───────────────────────── */

    /* HERO */
    .hero {
      background:
        linear-gradient(rgba(15,23,42,.75), rgba(15,23,42,.75)),
        url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=1400') center/cover;
      border-radius: 20px;
      padding: 80px 56px;
      color: white;
      text-align: center;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      animation: fadeUp .8s ease;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: rgba(255,255,255,.08);
      border-radius: 50%;
      top: -120px; right: -100px;
    }

    .hero h1 {
      font-size: 44px;
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    .hero p {
      font-size: 17px;
      line-height: 1.8;
      max-width: 780px;
      margin: auto;
      color: #e2e8f0;
    }

    /* CARDS GRID */
    .about-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 22px;
      margin-bottom: 28px;
    }

    .about-card {
      background: white;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(15,23,42,.06);
      transition: .4s ease;
      position: relative;
      overflow: hidden;
      animation: fadeUp .8s ease;
      border: 1px solid #eef2f6;
    }

    .about-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: linear-gradient(90deg, #2563eb, #7c3aed);
    }

    .about-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(15,23,42,.12);
    }

    .about-card h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #0f172a;
    }

    .about-card p {
      color: #64748b;
      line-height: 1.9;
      font-size: 14.5px;
    }

    /* QUOTES */
    .quote {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      border-radius: 20px;
      padding: 38px;
      color: white;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 1s ease;
    }

    .quote::after {
      content: '❝';
      position: absolute;
      right: 28px; top: 12px;
      font-size: 80px;
      opacity: .15;
    }

    .quote p {
      font-size: 20px;
      line-height: 1.8;
      font-weight: 500;
      margin-bottom: 16px;
    }

    .quote span {
      font-size: 13px;
      opacity: .9;
      letter-spacing: 1px;
    }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero { padding: 50px 22px; }
      .hero h1 { font-size: 32px; }
      .hero p  { font-size: 15px; }
    }
  </style>
</head>

<body>

<!-- Sidebar (same pattern as users.html) -->
<div id="sidebar-container"></div>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <h1 class="topbar-title">About Us</h1>
    <div class="topbar-right">
      <span class="topbar-date" id="currentDate"></span>
      <div class="notif-btn" title="Notifications">
        🔔
        <span class="notif-badge" id="notifCount">3</span>
      </div>
      <div class="avatar-top" id="topbarAvatar">MV</div>
    </div>
  </header>

  <div class="content">

    <!-- Top bar: viewing indicator + edit button -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; animation: fadeUp .6s ease;">
      <span style="font-size:13px; color:#64748b; font-weight:500; background:white; padding:8px 16px; border-radius:20px; border:1px solid #e2e8f0;">
        <i class="ti ti-eye" style="margin-right:6px;"></i>Viewing Published Page
      </span>
      <a href="about-edit.html" style="
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white; padding: 10px 20px; border-radius: 10px;
        font-weight: 600; font-size: 13.5px; text-decoration: none;
        display: inline-flex; align-items: center; gap: 8px;
        box-shadow: 0 6px 16px rgba(37,99,235,.25);
        transition: .3s ease;
      " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform=''">
        <i class="ti ti-pencil"></i> Edit Page
      </a>
    </div>

   <!-- HERO -->
<div class="hero">
    <h1 id="companyName"></h1>
    <p id="heroTagline"></p>
</div>

<div class="about-grid">

    <div class="about-card">
        <h3>Our Mission</h3>
        <p id="mission"></p>
    </div>

    <div class="about-card">
        <h3>Our Values</h3>
        <p id="values"></p>
    </div>

</div>

<div class="quote">
    <p id="quote1"></p>
    <span>— Leadership Team</span>
</div>

<div class="quote">
    <p id="quote2"></p>
    <span>— People & Culture</span>
</div>

  </div><!-- /content -->

  <!-- Footer -->
  <div id="footer-container"></div>
</main>

<script>
  fetch('footer.html').then(r=>r.text()).then(h=>{
    const fc=document.getElementById('footer-container');
    if(fc) fc.innerHTML=h;
  }).catch(()=>{});
</script>

<script>
  // Load sidebar
  fetch('sidebar.html')
    .then(r => r.text())
    .then(html => {
      document.getElementById('sidebar-container').innerHTML = html;
      // Mark active nav item
      document.querySelectorAll('.nav-item').forEach(el => {
        if (el.getAttribute('href') === 'about-us.html') el.classList.add('active');
      });
    });

  // Current date
  const d = new Date();
  const dateEl = document.getElementById('currentDate');
  if (dateEl) dateEl.textContent = d.toLocaleDateString('en-IN', { weekday:'long', year:'numeric', month:'long', day:'numeric' });




async function loadAboutData(){
  try {
    const res  = await fetch('/api/about');
    const json = await res.json();
    const data = json.data || json; // handle both {data:{...}} and direct object

    document.getElementById("companyName").innerText = data.companyName || "My Ecstasy";
    document.getElementById("heroTagline").innerText = data.heroTagline || "";
    document.getElementById("mission").innerText     = data.mission     || "";
    document.getElementById("values").innerText      = data.values      || "";
    document.getElementById("quote1").innerText      = data.quote1      || "";
    document.getElementById("quote2").innerText      = data.quote2      || "";
  } catch(err) {
    console.log(err);
  }
}

loadAboutData();

 // ── Logout ────────────────────────────────────────────────────────────────
  async function logout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/';
  }
</script>

<script src="topbar-utils.js"></script>
</body>
</html>
