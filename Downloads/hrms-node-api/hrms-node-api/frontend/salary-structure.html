<!DOCTYPE html>
<html>

<head>

<title>Salary Structure</title>

<link rel="stylesheet"
href="./css/style.css">

</head>

<body>

<div class="main">

<div class="top-title">
Salary Structures
</div>

<div class="employee-layout">

<div class="employee-list">

<div class="employee-card">

<div class="employee-name">
Deepthi Sannayila
</div>

<div class="employee-role">
Software Developer
</div>

</div>

<div class="employee-card">

<div class="employee-name">
Finance Manager
</div>

<div class="employee-role">
Finance
</div>

</div>

</div>

<div class="form-section">

<div class="section-title">
New Salary Structure
</div>

<div class="grid">

<div class="input-group">
<label>Emp Code</label>
<input type="text">
</div>

<div class="input-group">
<label>Designation</label>
<input type="text">
</div>

<div class="input-group">
<label>Joining Date</label>
<input type="date">
</div>

<div class="input-group">
<label>PAN Number</label>
<input type="text">
</div>

<div class="input-group">
<label>UAN Number</label>
<input type="text">
</div>

<div class="input-group">
<label>PF Number</label>
<input type="text">
</div>

</div>

<div class="section-title">
Monthly Earnings
</div>

<div class="grid">

<div class="input-group">
<label>Basic Salary</label>
<input type="number">
</div>

<div class="input-group">
<label>HRA</label>
<input type="number">
</div>

<div class="input-group">
<label>Conveyance</label>
<input type="number">
</div>

<div class="input-group">
<label>Medical Allowance</label>
<input type="number">
</div>

<div class="input-group">
<label>Special Allowance</label>
<input type="number">
</div>

<div class="salary-box">
₹ 0.00
</div>

</div>

<div class="section-title">
Deductions
</div>

<div class="grid">

<div class="input-group">
<label>PF</label>
<input type="number">
</div>

<div class="input-group">
<label>Tax</label>
<input type="number">
</div>

<div class="input-group">
<label>Other Deduction</label>
<input type="number">
</div>

</div>

<div class="input-group">

<label>Notes</label>

<textarea></textarea>

</div>

<button class="save-btn">

Save Structure

</button>

<table class="table">

<tr>

<th>Basic</th>
<th>HRA</th>
<th>Gross</th>
<th>Net</th>

</tr>

<tbody id="salaryTableBody">

</tbody>

</table>

</div>

</div>

</div>

<script src="./js/salary.js"></script>

</body>
</html>
