<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Important Events
  </title>

  <link rel="stylesheet"
        href="./css/events.css">

</head>

<body>
  <!-- MAIN CONTENT -->

  <div class="main-content">

    <!-- TOP HEADER -->

    <div class="top-header">

      <h2>
        Important Events
      </h2>

      <div class="top-right">

        <div class="today-date"
             id="todayDate">
        </div>

        <div class="notification-box">

          🔔

          <span class="notification-count">
            3
          </span>

        </div>

        <div class="mini-profile">
          DS
        </div>

      </div>

    </div>

    <!-- TABS -->

    <div class="tabs">

      <button class="tab active-tab"
              onclick="loadEvents('all', this)">

        All Events

      </button>

      <button class="tab"
              onclick="loadEvents('review', this)">

        Performance Review

      </button>

      <button class="tab"
              onclick="loadEvents('event', this)">

        Company Event

      </button>

      <button class="tab"
              onclick="loadEvents('deadline', this)">

        Deadline

      </button>

      <button class="tab"
              onclick="loadEvents('townhall', this)">

        Town Hall

      </button>

      <button class="tab"
              onclick="loadEvents('other', this)">

        Other

      </button>

    </div>

    <!-- EVENTS CARD -->

    <div class="events-card">

      <div class="events-header">

        <div class="events-title">

          📌 IMPORTANT EVENTS

        </div>

        <div class="event-count">

          <span id="topCount">
            0
          </span>

          events

        </div>

      </div>

      <div class="upcoming-row">

        <span class="green-dot"></span>

        UPCOMING EVENTS
        (<span id="eventCount">0</span>)

      </div>

      <div id="eventsContainer">

      </div>

    </div>

  </div>

</div>

<script src="./js/events.js"></script>

</body>

</html>
