<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sidebar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f4f6fb;
}

/* =========================
SIDEBAR
========================= */

.sidebar{
    width:258px;
    height:100vh;
    background:#1c3b67;
    position:fixed;
    top:0;
    left:0;
    display:flex;
    flex-direction:column;
    z-index:100;
}

/* =========================
LOGO
========================= */

.logo-area{
    height:88px;
    padding:0 24px;
    display:flex;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,0.06);
}

.logo-wrap{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    background:rgba(255,255,255,0.08);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:22px;
    font-weight:700;
}

.logo-title{
    color:#fff;
    font-size:19px;
    font-weight:700;
}

.logo-sub{
    color:rgba(255,255,255,0.42);
    font-size:10px;
    letter-spacing:1.2px;
    margin-top:3px;
}

/* =========================
NAVIGATION
========================= */

.sidebar-nav{
    flex:1;
    overflow-y:auto;
    padding:18px 12px;
}

.sidebar-nav::-webkit-scrollbar{
    width:5px;
}

.sidebar-nav::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,0.1);
    border-radius:20px;
}

.nav-label{
    color:rgba(255,255,255,0.35);
    font-size:11px;
    letter-spacing:1px;
    font-weight:700;
    margin:6px 12px 12px;
}

.nav-link{
    height:46px;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 16px;
    color:rgba(255,255,255,0.72);
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    transition:.25s;
    margin-bottom:4px;
}

.nav-link i{
    width:18px;
}

.nav-link:hover{
    background:rgba(255,255,255,0.06);
    color:#fff;
}

.nav-link.active{
    background:#f0a824;
    color:#fff;
}

/* =========================
FOOTER
========================= */

.sidebar-footer{
    padding:16px;
    border-top:1px solid rgba(255,255,255,0.06);
}

.user-box{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.user-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#f0a824;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

.user-name{
    color:#fff;
    font-size:14px;
    font-weight:600;
}

.user-role{
    color:rgba(255,255,255,0.42);
    font-size:12px;
}

.logout-btn{
    width:100%;
    height:42px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-size:14px;
    cursor:pointer;
    transition:.25s;
}

.logout-btn:hover{
    background:rgba(255,255,255,0.14);
}

/* =========================
MAIN CONTENT
========================= */

.main-content{
    margin-left:258px;
    height:100vh;
}

iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>

</head>
<body>

<!-- =========================
SIDEBAR
========================= -->

<aside class="sidebar">

    <!-- LOGO -->

    <div class="logo-area">

        <div class="logo-wrap">

            <div class="logo-icon">
                ∞
            </div>

            <div>

                <div class="logo-title">
                    My Ecstasy
                </div>

                <div class="logo-sub">
                    HR PORTAL
                </div>

            </div>

        </div>

    </div>

    <!-- NAVIGATION -->

    <nav class="sidebar-nav">

        <div class="nav-label">
            MAIN
        </div>

        <!-- DASHBOARD -->

        <a href="dashboard.html"
           target="contentFrame"
           class="nav-link active">

            <i class="fas fa-th-large"></i>
            Dashboard

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-calendar-check"></i>
            My Attendance

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-calendar-alt"></i>
            Attendance

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-user"></i>
            My Leaves

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-user-circle"></i>
            Leave Management

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-check-square"></i>
            Review RM Cards

        </a>

        <!-- JOBCARDS -->

        <a href="jobcards/jobcards.html"
           target="contentFrame"
           class="nav-link">

            <i class="far fa-file-alt"></i>
            My Job Cards

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-comment"></i>
            Help Desk

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-calendar"></i>
            Holiday Calendar

        </a>

        <a href="#"
           class="nav-link">

            <i class="fas fa-birthday-cake"></i>
            Birthdays

        </a>

        <a href="#"
           class="nav-link">

            <i class="far fa-star"></i>
            Important Events

        </a>

    </nav>

    <!-- FOOTER -->

    <div class="sidebar-footer">

        <div class="user-box">

            <div class="user-avatar">
                MV
            </div>

            <div>

                <div class="user-name">
                    Mude Vishnu Priya
                </div>

                <div class="user-role">
                    HR Admin · HR
                </div>

            </div>

        </div>

        <button class="logout-btn">
            Sign Out
        </button>

    </div>

</aside>


<!-- =========================
RIGHT SIDE CONTENT
========================= -->

<div class="main-content">

    <!-- DEFAULT PAGE -->

    <iframe
        name="contentFrame"
        src="dashboard.html">
    </iframe>

</div>

</body>
</html>
