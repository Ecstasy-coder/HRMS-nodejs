<script>

/* =========================
   SIDEBAR
========================= */

fetch("sidebar.html")
.then(res => res.text())
.then(data => {
  document.getElementById(
    "sidebar-container"
  ).innerHTML = data;
});

/* =========================
   API
========================= */

const API =
  "http://localhost:5000/api/users";

let employees = [];

/* =========================
   LOAD DATA
========================= */

async function loadBirthdays(){

  try{

    const res = await fetch(API);

    const users = await res.json();

    employees = users.filter(user =>
      user.dateOfBirth &&
      user.dateOfBirth !== ""
    );

    employees = employees.map(emp => {

      return {

        ...emp,

        daysUntil:
          getDaysUntilBirthday(
            emp.dateOfBirth
          ),

        age:
          getAge(
            emp.dateOfBirth
          )

      };

    });

    employees.sort((a,b)=>
      a.daysUntil - b.daysUntil
    );

    updateStats();

    renderUpcoming();

    renderMonth();

    renderTable(employees);

  }catch(error){

    console.log(error);

  }

}

/* =========================
   DATE FUNCTIONS
========================= */

function getDaysUntilBirthday(dob){

  const today = new Date();

  const birthDate = new Date(dob);

  const nextBirthday = new Date(
    today.getFullYear(),
    birthDate.getMonth(),
    birthDate.getDate()
  );

  today.setHours(0,0,0,0);

  nextBirthday.setHours(0,0,0,0);

  if(nextBirthday < today){

    nextBirthday.setFullYear(
      today.getFullYear() + 1
    );
  }

  const diff =
    nextBirthday - today;

  return Math.ceil(
    diff / (1000 * 60 * 60 * 24)
  );
}

function getAge(dob){

  return (
    new Date().getFullYear()
    -
    new Date(dob).getFullYear()
  );
}

/* =========================
   UPDATE STATS
========================= */

function updateStats(){

  const today = new Date();

  let todayCount = 0;

  let monthCount = 0;

  employees.forEach(emp => {

    const dob =
      new Date(emp.dateOfBirth);

    if(
      dob.getDate() === today.getDate()
      &&
      dob.getMonth() === today.getMonth()
    ){
      todayCount++;
    }

    if(
      dob.getMonth() === today.getMonth()
    ){
      monthCount++;
    }

  });

  document.getElementById(
    "todayCount"
  ).innerText = todayCount;

  document.getElementById(
    "monthCount"
  ).innerText = monthCount;

  document.getElementById(
    "totalEmployees"
  ).innerText = employees.length;

  document.getElementById(
    "upcomingTotal"
  ).innerText =
    employees.length + " total";

  document.getElementById(
    "monthTotal"
  ).innerText =
    employees.length + " birthdays";

  const currentDate =
    today.toLocaleDateString(
      "en-GB",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

  document.getElementById(
    "todayDate"
  ).innerText = currentDate;

  document.getElementById(
    "todayMonth"
  ).innerHTML =
    today.getDate()
    + "<br>" +
    today.toLocaleString(
      "default",
      {month:"long"}
    );

  document.getElementById(
    "currentMonthYear"
  ).innerHTML =
    today.toLocaleString(
      "default",
      {month:"long"}
    )
    +
    "<br>"
    +
    today.getFullYear();

  if(employees.length > 0){

    document.getElementById(
      "nextBirthday"
    ).innerText =
      employees[0].name;

    document.getElementById(
      "nextDays"
    ).innerHTML =
      "In "
      +
      employees[0].daysUntil
      +
      "<br>days";
  }

}

/* =========================
   UPCOMING
========================= */

function renderUpcoming(){

  const container =
    document.getElementById(
      "upcomingList"
    );

  container.innerHTML = "";

  employees.forEach(emp => {

    container.innerHTML += `

      <div class="birthday-item">

        <div class="left">

          <div class="avatar">
            ${
              emp.name
              .split(" ")
              .map(n => n[0])
              .join("")
              .substring(0,2)
              .toUpperCase()
            }
          </div>

          <div class="user-info">

            <strong>
              ${emp.name}
            </strong>

            <p>
              ${emp.department || "-"}
              ·
              ${new Date(emp.dateOfBirth)
                .toLocaleString(
                  "default",
                  {
                    day:"2-digit",
                    month:"long"
                  }
                )}
            </p>

          </div>

        </div>

        <div class="days">

          ${
            emp.daysUntil === 0
            ? "Today!"
            : `In ${emp.daysUntil} days`
          }

        </div>

      </div>

    `;

  });

}

/* =========================
   MONTH LIST
========================= */

function renderMonth(){

  const container =
    document.getElementById(
      "monthList"
    );

  const grouped = {};

  employees.forEach(emp => {

    const month =
      new Date(emp.dateOfBirth)
      .toLocaleString(
        "default",
        {month:"long"}
      );

    if(!grouped[month]){
      grouped[month] = [];
    }

    grouped[month].push(emp);

  });

  container.innerHTML = "";

  for(let month in grouped){

    container.innerHTML += `

      <div class="month-block">

        <div class="month-header">

          <h4>${month}</h4>

          <div class="month-count">
            ${grouped[month].length}
          </div>

        </div>

        <div class="month-users">

          ${grouped[month]
            .map(emp => `

              <div class="month-user">

                ${emp.name}
                (${new Date(emp.dateOfBirth)
                  .getDate()})

              </div>

            `)
            .join("")
          }

        </div>

      </div>

    `;
  }

}

/* =========================
   TABLE
========================= */

function renderTable(list){

  const tbody =
    document.getElementById(
      "tableBody"
    );

  tbody.innerHTML = "";

  if(list.length === 0){

    tbody.innerHTML = `

      <tr>

        <td colspan="6"
            class="no-data">

          No Birthday Records Found

        </td>

      </tr>

    `;

    return;
  }

  list.forEach(emp => {

    const initials = emp.name
      ? emp.name
          .split(" ")
          .map(n => n[0])
          .join("")
          .substring(0,2)
          .toUpperCase()
      : "U";

    tbody.innerHTML += `

      <tr>

        <td>

          <div class="user-cell">

            <div class="table-avatar">
              ${initials}
            </div>

            <div class="user-text">

              <strong>
                ${emp.name}
              </strong>

              <span>
                ${emp.email || "-"}
              </span>

            </div>

          </div>

        </td>

        <td>
          ${emp.department || "-"}
        </td>

        <td>

          ${new Date(emp.dateOfBirth)
            .toLocaleDateString(
              "en-GB",
              {
                day:"2-digit",
                month:"short",
                year:"numeric"
              }
            )}

        </td>

        <td>

  ${new Date(emp.dateOfBirth)
    .toLocaleDateString(
      "en-GB",
      {
        day:"2-digit",
        month:"long",
      }
    )}

</td>

        </td>

        <td>

          <span class="days-pill">

            ${
              emp.daysUntil === 0
              ? "Today!"
              : emp.daysUntil + " days"
            }

          </span>

        </td>

        <td class="age">
          ${emp.age} yrs
        </td>

      </tr>

    `;
  });

}

/* =========================
   SEARCH
========================= */

document.getElementById(
  "search"
).addEventListener("keyup", e => {

  const value =
    e.target.value.toLowerCase();

  const filtered =
    employees.filter(emp => {

      return (

        (emp.name || "")
        .toLowerCase()
        .includes(value)

        ||

        (emp.department || "")
        .toLowerCase()
        .includes(value)

      );

    });

  renderTable(filtered);

});

/* =========================
   EXPORT CSV
========================= */

function exportCSV(){

  let csv = [];

  csv.push(
    [
      "Name",
      "Department",
      "Date Of Birth",
      "Birthday",
      "Days Until",
      "Age"
    ].join(",")
  );

  employees.forEach(emp => {

    csv.push([

      emp.name,

      emp.department || "",

      new Date(emp.dateOfBirth)
      .toLocaleDateString("en-GB"),

      new Date(emp.dateOfBirth)
      .toLocaleString(
        "default",
        {
          day:"numeric",
          month:"long"
        }
      ),

      emp.daysUntil,

      emp.age

    ].join(","));

  });

  const blob =
    new Blob(
      [csv.join("\n")],
      {type:"text/csv"}
    );

  const url =
    window.URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download = "birthdays.csv";

  a.click();

}
