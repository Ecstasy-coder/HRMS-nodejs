<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>
    Important Events
  </title>

  <link rel="stylesheet"
        href="./css/events.css">
        <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>
  <!-- MAIN CONTENT -->
<div class="chandan">
  <div class="main-content">
      <div id="sidebar"></div>
    <!-- TOP HEADER -->
        
    <div >
                  
      <div id="topbar-container"></div>

    </div>

    <!-- TABS -->

    <div class="tabs">

      <button class="tab active-tab"
              onclick="loadEvents('all', this)">

        All Events

      </button>

      <button class="tab"
              onclick="loadEvents('review', this)">

        Performance Review

      </button>

      <button class="tab"
              onclick="loadEvents('event', this)">

        Company Event

      </button>

      <button class="tab"
              onclick="loadEvents('deadline', this)">

        Deadline

      </button>

      <button class="tab"
              onclick="loadEvents('townhall', this)">

        Town Hall

      </button>

      <button class="tab"
              onclick="loadEvents('other', this)">

        Other

      </button>

    </div>

    <!-- EVENTS CARD -->

    <div class="events-card">

      <div class="events-header">

        <div class="events-title">

          📌 IMPORTANT EVENTS

        </div>

        <div class="event-count">

          <span id="topCount">
            0
          </span>

          events

        </div>

      </div>

      <div class="upcoming-row">

        <span class="green-dot"></span>

        UPCOMING EVENTS
        (<span id="eventCount">0</span>)

      </div>

      <div id="eventsContainer">

      </div>

    </div>
       
  </div>
       <div id="footer-container"></div>
</div>

<script src="./js/sidebar.js"></script>
<script src="./js/topbar.js"></script>
<script src="./js/events.js"></script>

<script>

fetch("sidebar.html")
.then(res => res.text())
.then(data => {

    document.getElementById("sidebar").innerHTML = data;

    highlightCurrentSidebarPage();

});

fetch("topbar.html")
.then(res => res.text())
.then(data => {

    document.getElementById("topbar-container").innerHTML = data;

    setModule();
    setDate();
    setAvatar();

});


fetch("footer.html")
.then(res => res.text())
.then(data => {

    document.getElementById("footer-container").innerHTML = data;

});
</script>
</body>

</html>
