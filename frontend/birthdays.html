<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthdays · My Ecstasy HR Portal</title>
  <script src="/api-config.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

  <!-- Shared design system -->
  <link rel="stylesheet" href="common.css">

  <style>
    /* ── Birthday-specific styles ────────────────────────────── */

    /* Two-column card row */
    .bday-cards-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-bottom: 28px;
    }

    /* Panel cards (upcoming / by-month) */
    .bday-panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 480px;
      overflow: hidden;
      animation: fade-up 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .bday-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .bday-panel-title { font-size: 15px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px; }
    .total-badge {
      background: var(--surface-alt); border: 1px solid var(--border);
      padding: 5px 14px; border-radius: 20px;
      font-size: 12px; color: #5f6b85; font-weight: 600;
    }

    .bday-panel-body {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }
    .bday-panel-body::-webkit-scrollbar { width: 5px; }
    .bday-panel-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

    /* Birthday list item */
    .birthday-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      border-bottom: 1px solid var(--surface-alt);
      transition: background 0.15s;
    }
    .birthday-item:hover { background: var(--surface-alt); }
    .birthday-item:last-child { border-bottom: none; }

    .bday-left { display: flex; align-items: center; gap: 14px; }

    .bday-avatar {
      width: 46px; height: 46px; border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #2563eb);
      color: white; font-weight: 700; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .bday-info strong { display: block; color: #111827; font-size: 14px; font-weight: 600; margin-bottom: 3px; }
    .bday-info p      { color: #6b7280; font-size: 12.5px; }

    .days-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600;
      color: #1e293b;
      background: rgba(0,0,0,0.05);
      border: 1px solid rgba(0,0,0,0.1);
      padding: 5px 12px; border-radius: 20px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .days-pill.today {
      background: rgba(34,197,94,0.12);
      border-color: rgba(34,197,94,0.3);
      color: #166534;
    }

    /* By-month blocks */
    .month-block {
      padding: 12px 20px 8px;
      border-bottom: 1px solid var(--surface-alt);
    }
    .month-block:last-child { border-bottom: none; }

    .month-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .month-header h4 { font-size: 13.5px; font-weight: 700; color: var(--navy); }

    .month-count {
      width: 24px; height: 24px; border-radius: 50%;
      background: #ede9fe; color: #7c3aed;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
    }

    .month-users {
      display: flex; flex-wrap: wrap; gap: 8px;
      max-height: 100px; overflow-y: auto; padding-right: 4px;
      scrollbar-width: thin;
    }

    .month-user {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600; color: #1e293b;
      background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.1);
      padding: 4px 12px; border-radius: 20px; transition: all 0.2s;
    }
    .month-user:hover { background: var(--accent-glow); border-color: var(--accent); color: var(--accent-dark); }

    /* ── TABLE CARD ───────────────────────────────────────────── */
    .table-panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fade-up 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    .table-panel-header {
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 14px;
    }
    .table-panel-title { font-size: 16px; font-weight: 700; color: var(--navy); }

    .table-tools { display: flex; gap: 12px; align-items: center; }

    .table-search {
      position: relative;
    }
    .table-search i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: #9ca3af; font-size: 15px; pointer-events: none;
    }
    #search {
      padding: 10px 14px 10px 38px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      font-family: 'Sora', sans-serif;
      font-size: 13.5px;
      color: #111827;
      background: var(--surface);
      width: 260px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    .btn-export {
      background: var(--navy); color: white;
      border: none; padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      transition: background 0.2s;
    }
    .btn-export:hover { background: var(--navy-light); }

    /* Table */
    .bday-table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: var(--surface-alt);
      color: #64748b;
      padding: 14px 18px;
      text-transform: uppercase;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    tbody td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--surface-alt);
      color: #334155;
      font-size: 13.5px;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-alt); }

    .user-cell { display: flex; align-items: center; gap: 14px; }

    .table-avatar {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .user-text strong { display: block; color: #111827; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .user-text span   { color: #8b95a7; font-size: 12px; }

    .age-text { color: #94a3b8; font-size: 13px; }

    .no-data {
      padding: 48px; text-align: center; color: #64748b; font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .bday-cards-row { grid-template-columns: 1fr; }
      .bday-panel { height: 400px; }
    }
    @media (max-width: 768px) {
      .table-panel-header { flex-direction: column; align-items: flex-start; }
      #search { width: 100%; }
      .table-tools { width: 100%; flex-direction: column; }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar-container"></div>

<!-- MAIN -->
<main class="main">

  <header class="topbar">
    <h1 class="topbar-title">Birthday Management</h1>
    <div class="topbar-right">
      <span class="topbar-date" id="todayDate"></span>
      <div class="notif-btn" title="Notifications">
        🔔
        <span class="notif-badge">5</span>
      </div>
      <div class="avatar-top" id="topbarAvatar">MV</div>
    </div>
  </header>

  <div class="content">

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background:linear-gradient(135deg,#f472b6,#ec4899)">
          <i class="ti ti-cake"></i>
        </div>
        <div class="stat-text">
          <h2 id="todayCount">0</h2>
          <p>Birthdays Today</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:linear-gradient(135deg,#4f8ef7,#5b4de8)">
          <i class="ti ti-calendar-month"></i>
        </div>
        <div class="stat-text">
          <h2 id="monthCount">0</h2>
          <p>This Month</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:linear-gradient(135deg,#f0b429,#d97706)">
          <i class="ti ti-star"></i>
        </div>
        <div class="stat-text">
          <h2 id="nextBirthday" style="font-size:18px; line-height:1.3;">—</h2>
          <p>Next Birthday</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:linear-gradient(135deg,#22c55e,#16a34a)">
          <i class="ti ti-users"></i>
        </div>
        <div class="stat-text">
          <h2 id="totalEmployees">0</h2>
          <p>Employees w/ DOB</p>
        </div>
      </div>
    </div>

    <!-- Upcoming + By-Month cards -->
    <div class="bday-cards-row">

      <!-- Upcoming Birthdays -->
      <div class="bday-panel">
        <div class="bday-panel-header">
          <div class="bday-panel-title">
            <i class="ti ti-cake"></i> Upcoming Birthdays
          </div>
          <div class="total-badge" id="upcomingTotal">0 total</div>
        </div>
        <div class="bday-panel-body" id="upcomingList">
          <div class="empty-state small"><i class="ti ti-loader-2 spin"></i><p>Loading…</p></div>
        </div>
      </div>

      <!-- By Month -->
      <div class="bday-panel">
        <div class="bday-panel-header">
          <div class="bday-panel-title">
            <i class="ti ti-calendar-event"></i> By Month
          </div>
          <div class="total-badge" id="monthTotal">0 birthdays</div>
        </div>
        <div class="bday-panel-body" id="monthList">
          <div class="empty-state small"><i class="ti ti-loader-2 spin"></i><p>Loading…</p></div>
        </div>
      </div>

    </div>

    <!-- Table -->
    <div class="table-panel">
      <div class="table-panel-header">
        <div class="table-panel-title">All Employees — Birthday Directory</div>
        <div class="table-tools">
          <div class="table-search">
            <i class="ti ti-search"></i>
            <input type="text" id="search" placeholder="Search name or department…">
          </div>
          <button class="btn-export" onclick="exportCSV()">
            <i class="ti ti-download"></i> Export CSV
          </button>
        </div>
      </div>
      <div class="bday-table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Department</th>
              <th>Date of Birth</th>
              <th>Birthday</th>
              <th>Days Until</th>
              <th>Age This Year</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div><!-- /content -->
</main>

<!-- Toast -->
<div class="toast-container" id="toasts"></div>

<!-- Birthday logic -->
<script src="birthdays.js"></script>

</body>
</html>
