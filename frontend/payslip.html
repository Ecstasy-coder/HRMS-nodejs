<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Payslips</title>
    <link rel="stylesheet" href="css/payslip.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

     <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="container">

               <div id="sidebar"></div>
                
    <!-- Main Content -->

    <div class="ranu">
    <div class="main-content">

        <!-- Header -->
        <div id="topbar-container"></div>

        <div>

            <div class="top-row">
                <p>View and download your monthly salary slips</p>

                <select id="yearSelect">
                    <option>2026</option>
                    <option>2025</option>
                    <option>2024</option>
                </select>
            </div>

            <!-- Summary Cards -->

           <div class="summary-cards">

                 <div class="summary-box">
                    <h4>MONTHS PAID</h4>
                    <p><span id="monthsPaid">0</span></p>
                    <small>of 12</small>
                </div>

                <div class="summary-box">
                    <h4>TOTAL GROSS</h4>
                    <p id="totalGross">₹0.00</p>
                </div>

                <div class="summary-box">
                    <h4>TOTAL TAKE HOME</h4>
                    <p class="green" id="totalTakeHome">₹0.00</p>
                </div>

                <div class="summary-box">
                    <h4>BONUS + INCENTIVE</h4>
                    <p class="blue" id="totalBonus">₹0.00</p>
                </div>

                <div class="summary-box">
                    <h4>TOTAL PF SAVED</h4>
                    <p id="totalPF">₹0.00</p>
                </div>

            </div>


            <!-- Dynamic Payslip Cards -->
            <div class="cards"></div>

            <!-- PDF Note -->
            <div class="info-box">
                <i class="fa fa-lightbulb"></i>
                Save as PDF: Click "View Payslip" → press <kbd>Ctrl+P</kbd> → select <b>Save as PDF</b> → Save.
            </div>
          
        </div>
        
    </div>
    <div id="footer-container"></div>
    </div>
</div>

<script src="./js/payslip.js"></script>
<script src="./js/sidebar.js"></script>
<script src="./js/topbar.js"></script>

<script>

fetch("sidebar.html")
.then(res => res.text())
.then(data => {

    document.getElementById("sidebar").innerHTML = data;

    highlightCurrentSidebarPage();

});

fetch("topbar.html")
.then(res => res.text())
.then(data => {

    document.getElementById("topbar-container").innerHTML = data;

    setModule();
    setDate();
    setAvatar();

});


fetch("footer.html")
.then(res => res.text())
.then(data => {

    document.getElementById("footer-container").innerHTML = data;

});
</script>
</body>
</html>
