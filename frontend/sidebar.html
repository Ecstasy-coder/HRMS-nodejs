<head>

<link rel="stylesheet"
href="./css/sidebar.css">

<body>

<!-- =========================

<aside class="sidebar">

    <!-- LOGO -->

    <div class="sidebar-logo">

            <div>

            </div>

        </div>

    </div>

    <!-- NAVIGATION -->

    <nav class="sidebar-nav">

        <div class="nav-label">
            MAIN
        </div>

        <a href="dashboard.html" class="nav-link active"  target="contentFrame">
            <i class="fas fa-th-large"></i>
            Dashboard
        </a>
        <a href="salary-structure.html" class="nav-link" target="contentFrame">
            <i class="fa-solid fa-dollar-sign"></i>
             Salary Structure
        </a>
       
        <a href="payroll.html" class="nav-link" target="contentFrame">
          <i class="fa-solid fa-credit-card"></i>

            <i class="far fa-star"></i>

        </a>
        
       <a href="calender.html" class="nav-link" target="contentFrame">
            <i class="far fa-star"></i>

    </nav>

    <!-- FOOTER -->

    <div class="sidebar-footer">

        <div class="user-info">

            <div class="user-avatar">
                MV
            </div>

            <div>

                <div class="user-name">
                    Mude Vishnu Priya
                </div>

                <div class="user-role">
                    HR Admin · HR
                </div>

            </div>

        </div>

        <button class="btn-logout">
            Sign Out
        </button>

    </div>

</aside>



<div class="main-content">

    <!-- DEFAULT PAGE -->

    <iframe
        name="contentFrame"
        src="dashboard.html" class="content-frame"></iframe>
   

   
       <!-- <iframe name="contentFrame"
        src="importantEvent.html class="content-frame""></iframe> -->
   
       <!-- <iframe name="contentFrame"
        src="payslip.html" class="content-frame"></iframe> -->


</div>


<script>
    const navLinks = document.querySelectorAll(".nav-link");

    navLinks.forEach(link => {
        link.addEventListener("click", function () {

            // Remove active class from all links
            navLinks.forEach(item => {
                item.classList.remove("active");
            });

            // Add active class to clicked link
            this.classList.add("active");
        });
    });
</script>
</body>
</html>
